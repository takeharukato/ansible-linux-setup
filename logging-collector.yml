- name: Configure logging collector hosts
  hosts: logging_collector
  remote_user: '{{ ansible_user }}'
  become: true
  roles:
    # Fleet Bootstrapが配布する方針へ登録し, 共通のElastic Agent本体を導入する。
    - role: elastic-agent
      tags: elastic-agent
    # Fleet Bootstrapが配布する方針へ登録し, Kubernetes用のElastic Agent本体を導入する。
    - role: elastic-agent-k8s
      tags: elastic-agent-k8s
    # Kubernetes API監査ログ収集用のElastic Agentを導入する。
    - role: elastic-agent-k8s-audit
      tags: elastic-agent-k8s-audit
