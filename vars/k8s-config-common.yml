---

#
# Kubernetesオペレータユーザ設定
#
# 注意事項:
# vars/all-config.ymlの前にインクルードする
#
k8s_operator_user: "kube"

# Kubernetesオペレータユーザのホームディレクトリ
# /home 直書きを避けるため, 初期値は空文字列とし, 各ロールで getent / user module の実行結果から
# 実ホームディレクトリを解決した後に set_fact で上書きして使用する。
# 明示的に固定値を使用する場合は vars/all-config.yml で k8s_operator_home を上書きする。
k8s_operator_home: ""
# Kubernetesオペレータユーザのデフォルトシェル
k8s_operator_shell: "/bin/bash"
# Kubernetesオペレータユーザの所属グループ
k8s_operator_groups_list: "{{ adm_groups }}"

# kubeadm設定ファイル格納ディレクトリ
k8s_kubeadm_config_store: "{{ ansible_home_dir }}/kubeadm"

# Kubernetes API操作で使用する管理者kubeconfigファイルのパス
k8s_admin_kubeconfig_path: "/etc/kubernetes/admin.conf"

# Helm操作を実施するユーザ一覧。
# 既定ではansible_userを候補として保持する。
# kubeユーザを追加する場合は, 以下を追加する
#   - "{{ k8s_operator_user | default('', true) | string | trim }}"
k8s_common_helm_execution_users:
  - "{{ ansible_user | default('', true) | string | trim }}"

# Helm操作で使用する共通OSユーザ一覧。
# 空文字列除外と重複除去を実施した一覧を実行時変数として提供する。
k8s_runtime_helm_execution_users: >-
  {{
    (
      (k8s_common_helm_execution_users | default([], true))
    )
    | map('string')
    | map('trim')
    | reject('equalto', '')
    | unique
    | list
  }}

# Helm操作で使用する共通代表OSユーザ。
# 明示指定値を優先し, 未指定時はansible_userを優先する。
k8s_runtime_helm_operator_user: >-
  {{
      (ansible_user | default('', true) | string | trim)
      if (
        (ansible_user | default('', true) | string | trim)
        in
        (k8s_runtime_helm_execution_users | default([], true))
      )
      else (k8s_runtime_helm_execution_users | first | default(ansible_user, true))
  }}

#
# k8s関連ロール共通のネットワークCIDR設定
#
# 物理サーバ/管理用VMネットワークのIPv4ネットワークアドレスとプレフィクス長から算出したCIDR値。
# vars/all-config.ymlのnetwork_ipv4_network_address, network_ipv4_prefix_lenを基に計算する。
# k8s関連ロールのみが使用するため, 各ロールのresolve-runtime-vars.ymlがランタイム変数
# (k8s_network_ipv4_cidr_runtime)へ複製し, タスクとテンプレートは複製後の変数のみを参照する。
k8s_network_ipv4_cidr_base: "{{ network_ipv4_network_address }}/{{ network_ipv4_prefix_len }}"
# 物理サーバ/管理用VMネットワークのIPv6ネットワークアドレスとプレフィクス長から算出したCIDR値。
# vars/all-config.ymlのnetwork_ipv6_network_address, network_ipv6_prefix_lenを基に計算する。
k8s_network_ipv6_cidr_base: "{{ network_ipv6_network_address }}/{{ network_ipv6_prefix_len }}"
