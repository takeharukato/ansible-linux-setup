#  Helmテンプレート描画タスク
#
---

# Helmテンプレート描画に必要な実行環境, release名, namespace, Chart,
# kubeconfig, 時間制限と再試行制御値を描画開始前に検証する。
# valuesファイルはbuild-values-argv.yml内で同じ共通検証を実行するため,
# ここでは重複して検証しない。
- name: Validate Helm template operation inputs
  ansible.builtin.include_tasks: validate.yml
  vars:
    k8s_helm_validation_requirements:
      - runtime
      - release
      - namespace
      - chart
      - kubeconfig
      - timing

# valuesファイルを指定順に'-f', '<path>'の引数列へ変換し,
# templateとupgradeで同じvalues引数生成処理を再利用できるようにする。
- name: Build Helm values arguments for template
  ansible.builtin.include_tasks: build-values-argv.yml

# helm templateはKubernetes資源を変更しない事前描画処理であるためchanged=falseとする。
# check modeでもmanifest描画結果を後続の製品固有検証へ渡す必要があるため,
# check_mode=falseを指定して描画処理を実行する。
# Helmコマンド自体が停止する場合にAnsible実行が無期限に待機しないように,
# 実際のHelm実行ユーザからGNU timeoutを経由してプロセス全体の実行時間を制限する。
# 一時的なChart取得失敗等を考慮し, 操作失敗時は設定された回数と間隔で再試行する。
# argv構築の対応関係:
# 1. sudo -u, timeout, helm template, release名, Chart参照を基本引数列にする。
# 2. namespaceを基本引数列へ追加する。
# 3. Chart版数が指定されている場合だけ--versionとChart版数を追加する。
# 4. kubeconfigを追加する。
# 5. build-values-argv.ymlで生成したvalues引数列を末尾へ追加する。
# 対応するjinja2式: 基本引数list + Chart版数引数list + kubeconfig引数list
# + k8s_helm_values_argv。
- name: Render Helm template
  ansible.builtin.command:
    argv: >-
      {{
        [
          'sudo',
          '-u',
          k8s_runtime_helm_operator_user | string | trim,
          'timeout',
          (k8s_helm_operation_timeout_seconds | int | string) ~ 's',
          'helm',
          'template',
          k8s_helm_release_name | string | trim,
          k8s_helm_chart_ref | string | trim,
          '--namespace',
          k8s_helm_namespace | string | trim
        ]
        +
        (
          [
            '--version',
            k8s_helm_chart_version | string | trim
          ]
          if (
            k8s_helm_chart_version
            | default('', true)
            | string
            | trim
            | length
          ) > 0
          else []
        )
        +
        [
          '--kubeconfig',
          k8s_helm_kubeconfig_path | string | trim
        ]
        + (k8s_helm_values_argv | default([], true))
      }}
  register: k8s_helm_template_result
  changed_when: false
  check_mode: false
  become: true
  until: k8s_helm_template_result.rc | default(1) | int == 0
  retries: "{{ k8s_helm_operation_retries | int }}"
  delay: "{{ k8s_helm_operation_retry_interval_seconds | int }}"
