#
#  Debian/Ubuntu用libyang構築・導入処理
#
#  コンパイル時のlibyangシンボル不足時と導入後のlibyangシンボル不足時の
#  双方で必要となる共通処理を実装
#
---

# libyangシンボル不足時に, 構築ホストでlibyangを再構築して導入先に反映する
- name: Remediate libyang packages when symbol is missing ({{ frr_libyang_phase_label }})
  when:
    - ansible_facts.os_family == 'Debian'
    - (frr_libyang_force_remediate | default(false) | bool) or ((frr_libyang_symbol_check_rc | int) != 0)
  block:

    # ターゲットホスト上で使用すべきランタイムパッケージ名を判定する
    # Ubuntu 24.04 系では libyang2t64 が既定になるため,
    # build host側ではなくtarget側の実状態に合わせる
    - name: Detect libyang runtime package variant on target host ({{ frr_libyang_phase_label }})
      ansible.builtin.shell: >-
        set -o pipefail;
        if dpkg-query -W -f='${Status}' libyang2t64 2>/dev/null |
          grep -q 'install ok installed'; then
          echo libyang2t64;
        else
          echo libyang2;
        fi
      args:
        executable: /bin/bash
      register: frr_libyang_runtime_pkg_detect_cmd
      changed_when: false

    # ターゲットホスト上で使用すべきランタイムパッケージ名を変数に格納する
    - name: Set libyang runtime package variant fact ({{ frr_libyang_phase_label }})
      ansible.builtin.set_fact:
        frr_libyang_runtime_pkg_name: >-
          {{ frr_libyang_runtime_pkg_detect_cmd.stdout | trim }}

    # Debian対象の代表ホストからlibyang再構築処理を実行する
    - name: Build compatible libyang packages ({{ frr_libyang_phase_label }})
      ansible.builtin.include_tasks: remediate-libyang-build.yml
      when:
        - frr_package_targets_debian | default([]) | length > 0
        - inventory_hostname == (frr_package_targets_debian | first)

    # 再構築したlibyangパッケージを各Debian対象ホストへ導入する
    - name: Install rebuilt libyang packages ({{ frr_libyang_phase_label }})
      ansible.builtin.include_tasks: remediate-libyang-install.yml
