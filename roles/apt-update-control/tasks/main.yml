#
#  タスクメイン部
#
#  include_tasksで他のタスクを読み込む
#
---

# 最初に変数設定を読み直す ( role単独で実行可能とするため )
- name: "Load Params"
  ansible.builtin.include_tasks: load-params.yml

# パッケージ導入処理
- name: "Package"
  ansible.builtin.include_tasks: package.yml

# ファイル・ディレクトリ作成処理
- name: "Directory"
  ansible.builtin.include_tasks: directory.yml

# ユーザ・グループ作成処理
- name: "User Group"
  ansible.builtin.include_tasks: user_group.yml

# サービス起動処理
- name: "Service"
  ansible.builtin.include_tasks: service.yml

# 設定ファイル作成処理
- name: "Config"
  ansible.builtin.include_tasks: config.yml

# systemd unitへ変更を加える前に入力値を検証し, 部分適用を防止する。
- name: "Validate parameters"
  ansible.builtin.include_tasks: validate.yml

# 構築期間中のAPT自動更新抑止を確立する場合だけactive処理を読み込む
# (apt_update_control_state == "active")。
- name: "Activate APT update control"
  ansible.builtin.include_tasks: activate.yml
  when: apt_update_control_state == "active"

# 構築完了後にAPT自動更新を通常運用へ戻す場合だけinactive処理を読み込む
# (apt_update_control_state == "inactive")。
- name: "Deactivate APT update control"
  ansible.builtin.include_tasks: deactivate.yml
  when: apt_update_control_state == "inactive"
