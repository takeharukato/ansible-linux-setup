#
#  タスクメイン部
#
#  include_tasksで他のタスクを読み込む
#
---

# 最初に変数設定を読み直す ( role単独で実行可能とするため )
- name: "Load Params"
  ansible.builtin.include_tasks: load-params.yml

# Filebeat の導入前提を確認し, 実行基盤の不足を早期に検出する。
- name: "Validate"
  ansible.builtin.include_tasks: validate.yml
  when:
    - logging_filebeat_enabled | default(true) | bool

# ソースからバイナリを構築, ローカルパッケージを作成して, パッケージ導入を実行し, 実行基盤を準備する。
- name: "Package"
  ansible.builtin.include_tasks: package.yml
  when:
    - logging_filebeat_enabled | default(true) | bool

# 設定, データ, ログの配置先を作成し, 実行前提を整える。
- name: "Directory"
  ansible.builtin.include_tasks: directory.yml
  when:
    - logging_filebeat_enabled | default(true) | bool

# 実行ユーザとグループを作成し, ディレクトリ所有権を整える。
- name: "User Group"
  ansible.builtin.include_tasks: user_group.yml
  when:
    - logging_filebeat_enabled | default(true) | bool

# systemd unit と Filebeat 設定ファイルを生成し, 起動設定を固定する。
- name: "Config"
  ansible.builtin.include_tasks: config.yml
  when:
    - logging_filebeat_enabled | default(true) | bool

# systemd サービスを起動し, 設定変更を反映する。
- name: "Service"
  ansible.builtin.include_tasks: service.yml
  when:
    - logging_filebeat_enabled | default(true) | bool

# 起動済みサービスの待受と応答を確認し, collector として利用可能であることを検証する。
- name: "Verify"
  ansible.builtin.include_tasks: verify.yml
  when:
    - logging_filebeat_enabled | default(true) | bool
