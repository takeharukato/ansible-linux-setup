#  パッケージ関連処理
#
---

# Filebeat 版数の先頭プレフィックスを除去し, パッケージ版数として使用する。
- name: Normalize filebeat version string for package metadata
  ansible.builtin.set_fact:
    filebeat_version_normalized: "{{ filebeat_version | regex_replace('^v', '') }}"

# 既存の Filebeat パッケージを削除する (Debian系)
- name: Remove existing filebeat package on Debian family before local package install
  ansible.builtin.apt:
    name: "{{ filebeat_package_name_debian }}"
    state: absent
    autoremove: true
  become: true
  when:
    - ansible_facts.os_family == 'Debian'
    - filebeat_remove_existing_package | default(true) | bool

# 既存の Filebeat パッケージを削除する (RedHat系)
- name: Remove existing filebeat package on RedHat family before local package install
  ansible.builtin.dnf:
    name: "{{ filebeat_package_name_rhel }}"
    state: absent
    autoremove: true
  become: true
  when:
    - ansible_facts.os_family == 'RedHat'
    - filebeat_remove_existing_package | default(true) | bool

# チェックモードではローカルパッケージの構築/導入をスキップする
- name: Skip local filebeat package build and install in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode: skipping local Filebeat package build/install steps.
      Filebeat version is {{ filebeat_version }}.
  when: ansible_check_mode | bool

# Filebeat 構築用の作業ディレクトリパスを実行ユーザごとに初期化する
- name: Set effective workspace for filebeat build
  ansible.builtin.set_fact:
    filebeat_build_workspace_effective: >-
      /tmp/filebeat-build-{{ lookup('env', 'USER') | default('ansible', true) }}
  run_once: true

# 制御ホスト上に作業ディレクトリを作成し, 書き込み不可の場合は代替へ切り替える
- name: Ensure filebeat build workspace exists on controller for pkgbld-common
  run_once: true
  when: not (ansible_check_mode | bool)
  block:

    # 制御ホスト上に作業ディレクトリを作成する。
    - name: Create configured filebeat build workspace on controller
      ansible.builtin.file:
        path: "{{ filebeat_build_workspace_effective }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    # 制御ホスト上の作業ディレクトリが書き込み可能であることを確認する。
    - name: Verify configured filebeat build workspace is writable on controller
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - >-
            probe="{{ filebeat_build_workspace_effective }}/.ansible-write-probe-$$";
            touch "$probe" && rm -f "$probe"
      delegate_to: localhost
      become: false
      changed_when: false
  rescue:

    # 制御ホスト上の作業ディレクトリが書き込み不可の場合は, ユーザごとの代替パスへ切り替える。
    - name: Switch filebeat build workspace to per-user fallback path
      ansible.builtin.set_fact:
        filebeat_build_workspace_effective: >-
          /tmp/filebeat-build-fallback-{{ lookup('env', 'USER') | default('ansible', true) }}

    # 制御ホスト上の代替パスを作成する。
    - name: Create fallback filebeat build workspace on controller
      ansible.builtin.file:
        path: "{{ filebeat_build_workspace_effective }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    # 制御ホスト上の代替パスが書き込み可能であることを確認する。
    - name: Verify fallback filebeat build workspace is writable on controller
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - >-
            probe="{{ filebeat_build_workspace_effective }}/.ansible-write-probe-$$";
            touch "$probe" && rm -f "$probe"
      delegate_to: localhost
      become: false
      changed_when: false

# 制御ホストで構築スクリプトを生成し, pkgbld-commonが構築ホストへコピーする
- name: Render filebeat deb build script on controller for pkgbld-common
  ansible.builtin.template:
    src: build-filebeat-deb.sh.j2
    dest: "{{ filebeat_build_workspace_effective }}/build-filebeat-deb.sh"
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  when: not (ansible_check_mode | bool)

# 制御ホストで構築スクリプトを生成し, pkgbld-commonが構築ホストへコピーする
- name: Render filebeat rpm build script on controller for pkgbld-common
  ansible.builtin.template:
    src: build-filebeat-rpm.sh.j2
    dest: "{{ filebeat_build_workspace_effective }}/build-filebeat-rpm.sh"
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  when: not (ansible_check_mode | bool)

# Filebeatパッケージを構築ホストで作成して導入する
- name: Build and install filebeat local packages via pkgbld-common # noqa var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: pkgbld-common
  vars:
    package_build_host: "{{ filebeat_build_host }}"
    package_build_workspace: "{{ filebeat_build_workspace_effective }}"
    package_build_output_dir: "{{ filebeat_build_workspace_effective }}/output"
    pkgbld_container_runtime: "{{ filebeat_build_container_runtime }}"
    pkgbld_container_network_mode: "{{ filebeat_build_container_network_mode }}"
    pkgbld_builder_image_debian: "{{ filebeat_build_container_image_debian }}"
    pkgbld_builder_image_rhel: "{{ filebeat_build_container_image_rhel }}"
    pkgbld_container_workdir: "{{ filebeat_build_container_workdir }}"
    pkgbld_container_output_dir: "{{ filebeat_build_container_workdir }}/output"
    pkgbld_build_script_src_debian: "{{ filebeat_build_workspace_effective }}/build-filebeat-deb.sh"
    pkgbld_build_script_name_debian: "build-filebeat-deb.sh"
    pkgbld_build_script_src_rhel: "{{ filebeat_build_workspace_effective }}/build-filebeat-rpm.sh"
    pkgbld_build_script_name_rhel: "build-filebeat-rpm.sh"
    pkgbld_build_script_src: "{{ filebeat_build_workspace_effective }}/build-filebeat-deb.sh"
    pkgbld_build_script_name: "build-filebeat-deb.sh"
    pkgbld_package_type: "deb"
    pkgbld_package_name: "{{ filebeat_package_name_debian }}"
    pkgbld_package_file_patterns_debian:
      - "{{ filebeat_package_name_debian }}_{{ filebeat_version_normalized }}-1_*.deb"
    pkgbld_package_file_patterns_rhel:
      - "{{ filebeat_package_name_rhel }}-{{ filebeat_version_normalized }}-1.*.rpm"
    package_targets: "{{ ansible_play_hosts_all }}"
    pkgbld_install_deb_lock_wait_seconds: "{{ filebeat_install_deb_lock_wait_seconds }}"
    pkgbld_build_timeout_seconds: "{{ filebeat_pkg_build_timeout_seconds }}"
    pkgbld_build_loop_delay_seconds: "{{ filebeat_pkg_build_loop_delay_seconds }}"
    pkgbld_container_env_args:
      - "-e"
      - "FILEBEAT_VERSION_TAG={{ filebeat_version }}"
      - "-e"
      - "FILEBEAT_VERSION_NORMALIZED={{ filebeat_version_normalized }}"
      - "-e"
      - "FILEBEAT_SOURCE_BASE_URL={{ filebeat_source_base_url }}"
      - "-e"
      - "FILEBEAT_DEB_PACKAGE_NAME={{ filebeat_package_name_debian }}"
      - "-e"
      - "FILEBEAT_RPM_PACKAGE_NAME={{ filebeat_package_name_rhel }}"
      - "-e"
      - "FILEBEAT_DEB_ARCH={{ filebeat_deb_arch }}"
      - "-e"
      - "FILEBEAT_RPM_ARCH={{ ansible_facts.architecture }}"
    pkgbld_verify_version_enabled: true
    pkgbld_verify_version_command:
      - "{{ filebeat_command }}"
      - version
    pkgbld_verify_version_regex: "([0-9]+\\.[0-9]+\\.[0-9]+)"
    pkgbld_verify_version_expected: "{{ filebeat_version_normalized | trim }}"
  when: not (ansible_check_mode | bool)
