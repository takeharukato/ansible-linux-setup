---

# service のポートが開くまで待ち, その後の HTTP 検査が失敗しないようにする。
- name: Wait for Filebeat HTTP port
  ansible.builtin.wait_for:
    host: "{{ filebeat_wait_host }}"
    port: "{{ filebeat_http_port }}"
    state: started
    timeout: "{{ filebeat_wait_timeout }}"
    delay: "{{ filebeat_wait_delay }}"
    sleep: "{{ filebeat_wait_sleep }}"
  delegate_to: "{{ filebeat_wait_delegate_to }}"
  register: filebeat_wait_result
  until: filebeat_wait_result is succeeded
  retries: "{{ filebeat_wait_retries }}"
  delay: "{{ filebeat_wait_sleep }}"

# Filebeat の HTTP 応答を確認し, collector として応答可能であることを検証する。
- name: Verify Filebeat response
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ filebeat_http_port }}/"
    method: GET
    return_content: true
    status_code:
      - 200
  register: filebeat_status_result
  until:
    - filebeat_status_result is succeeded
    - filebeat_status_result.status is defined
    - filebeat_status_result.status == 200
  # モジュール初期化や出力先接続確立に時間を要する場合があるため,
  # 応答確認の試行回数は timeout と sleep から導出する。
  retries: "{{ ((filebeat_wait_timeout | int) // ([filebeat_wait_sleep | int, 1] | max)) + 1 }}"
  delay: "{{ filebeat_wait_sleep }}"
  failed_when:
    - filebeat_status_result.status != 200
