---

# Compose が起動した Kibana 実体IDを取得し, 接頭辞付き名称でも追跡できるようにする。
- name: Resolve Kibana runtime container identifier
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ kibana_compose_file }}"
      - ps
      - -q
      - kibana
  args:
    chdir: "{{ kibana_compose_dir }}"
  register: kibana_runtime_container_id_cmd
  changed_when: false
  failed_when: false

# Kibana コンテナが稼働状態へ遷移したことを確認する。
# Docker Composeは, コンテナ生成時にkibana_container_nameで指定された名称に加え,
# Docker Composeのプロジェクト名やサービス名の接頭辞を付与してコンテナ名称を
# 生成するため, 接頭辞付き名称でも追跡できるようにする。
- name: Inspect Kibana container state
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - >-
        {{
          (kibana_runtime_container_id_cmd.stdout | default('', true) | trim)
          if ((kibana_runtime_container_id_cmd.stdout | default('', true) | trim | length) > 0)
          else kibana_container_name
        }}
  register: kibana_container_state_cmd
  changed_when: false
  until:
    - kibana_container_state_cmd is succeeded
    - kibana_container_state_cmd.stdout | length > 0
    - ((kibana_container_state_cmd.stdout | from_json | first).State.Running | default(false)) | bool
  retries: "{{ kibana_wait_retries }}"
  delay: "{{ kibana_wait_sleep }}"

# コンテナが稼働状態であることを最終確認し, 異常終了ループを検出する。
- name: Assert Kibana container is running
  ansible.builtin.assert:
    that:
      - ((kibana_container_state_cmd.stdout | from_json | first).State.Running | default(false)) | bool
    fail_msg: >-
      Kibana container is not running.
      container={{ kibana_container_name }}

# service のポートが開くまで待ち, その後の HTTP 検査が失敗しないようにする。
- name: Wait for Kibana port
  ansible.builtin.wait_for:
    host: "{{ kibana_wait_host }}"
    port: "{{ kibana_server_port }}"
    state: started
    timeout: "{{ kibana_wait_timeout }}"
    delay: "{{ kibana_wait_delay }}"
    sleep: "{{ kibana_wait_sleep }}"
  delegate_to: "{{ kibana_wait_delegate_to }}"
  register: kibana_wait_result
  until: kibana_wait_result is succeeded
  retries: "{{ kibana_wait_retries }}"
  delay: "{{ kibana_wait_sleep }}"

# Kibana の HTTP 応答を確認し, backend として応答可能であることを検証する。
# SavedObjects migration とプラグイン初期化の完了待ちに時間を要するため,
# status 確認の試行回数は timeout と sleep から導出する。
- name: Verify Kibana response locally
  ansible.builtin.uri:
    url: "{{ kibana_local_verify_endpoint_url }}/api/status"
    method: GET
    validate_certs: "{{ kibana_local_verify_validate_certs | bool }}"
    return_content: true
    status_code:
      - 200
      - 503
    timeout: "{{ kibana_health_request_timeout_seconds | int }}"
  register: kibana_status_result
  until:
    - >-
      (
        (kibana_status_result.json | default({})).get('status', {}).get('overall', {}).get(
          'state',
          (kibana_status_result.json | default({})).get('status', {}).get('overall', {}).get('level', '')
        )
      ) in ['green', 'yellow', 'available']
  retries: "{{ kibana_health_retries | int }}"
  delay: "{{ kibana_health_retry_interval_seconds | int }}"

# Kibana の HTTP 応答を確認し, 外部ホストからの疎通確認を任意で実施する。
- name: Verify Kibana response externally
  ansible.builtin.uri:
    url: "{{ kibana_runtime_endpoint_url }}/api/status"
    method: GET
    validate_certs: "{{ kibana_external_verify_validate_certs | bool }}"
    return_content: true
    status_code:
      - 200
      - 503
    timeout: "{{ kibana_health_request_timeout_seconds | int }}"
  register: kibana_external_status_result
  delegate_to: "{{ kibana_external_verify_delegate_to }}"
  until:
    - >-
      (
        (kibana_external_status_result.json | default({})).get('status', {}).get('overall', {}).get(
          'state',
          (kibana_external_status_result.json | default({})).get('status', {}).get('overall', {}).get('level', '')
        )
      ) in ['green', 'yellow', 'available']
  retries: "{{ kibana_health_retries | int }}"
  delay: "{{ kibana_health_retry_interval_seconds | int }}"
  when:
    - kibana_external_verify_enabled | bool
