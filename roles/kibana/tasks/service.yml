---

# backend 専用ネットワークの存在を確認する。
- name: Check kibana backend network
  ansible.builtin.command:
    cmd: "docker network inspect {{ kibana_network_name }}"
  register: kibana_network_inspect
  failed_when: false
  changed_when: false

# backend 専用ネットワークが存在しない場合は, backend専用ネットワークを作成し,
# Elasticsearch と接続できるようにする。
- name: Create kibana backend network
  ansible.builtin.command:
    cmd: "docker network create {{ kibana_network_name }}"
  when:
    - kibana_network_inspect.rc != 0
  changed_when: true

# 既存の同名コンテナが残っている場合に備え, 起動前に存在確認する。
- name: Check existing kibana container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - "{{ kibana_container_name }}"
  become: true
  register: kibana_container_inspect
  failed_when: false
  changed_when: false

# 既存の同名コンテナを削除して, compose 起動時の名前衝突と古い状態の残留を防止する。
- name: Remove existing kibana container before compose up
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - -f
      - "{{ kibana_container_name }}"
  become: true
  when:
    - kibana_container_inspect.rc == 0
  register: kibana_remove_existing_result
  changed_when: kibana_remove_existing_result.rc == 0

# compose 定義に基づいて Kibana を起動し, 設定変更を反映する。
- name: Start Kibana service container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ kibana_compose_file }}"
      - up
      - -d
      - --remove-orphans
  args:
    chdir: "{{ kibana_compose_dir }}"
  become: true
  register: kibana_start_result
  changed_when: kibana_start_result.rc == 0
