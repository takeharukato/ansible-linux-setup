#  -*- coding:utf-8 mode:yaml -*-
#  Ansible playbook
#
#  kubeconfig 配置先オペレータホーム解決タスク
#
---

# kubeconfig 配置先を実ホームへ合わせるため, オペレータユーザの passwd 情報を取得する。
- name: Resolve passwd entry for kubeconfig operator user
  ansible.builtin.getent:
    database: passwd
    key: "{{ k8s_operator_user }}"
  register: k8s_kubeconfig_operator_home_getent
  changed_when: false

# 解決した実ホームを共有ファクトへ保存し, 後続タスクの出力先ディレクトリ計算へ利用する。
- name: Record resolved home directory for kubeconfig operator user
  ansible.builtin.set_fact:
    k8s_operator_home_resolved: "{{ k8s_kubeconfig_operator_home_getent.ansible_facts.getent_passwd[k8s_operator_user][4] }}"
    k8s_operator_home: "{{ k8s_kubeconfig_operator_home_getent.ansible_facts.getent_passwd[k8s_operator_user][4] }}"
  changed_when: false
