#  -*- coding:utf-8 mode:yaml -*-
#  Ansible playbook
#
#  ワーカーノード向け kubeconfig 配布タスク
#
---

# 対応するコントロールプレーンを確認
- name: Ensure control plane host is specified for worker
  ansible.builtin.assert:
    that:
      - k8s_ctrlplane_host | default('') | length > 0
    fail_msg: "k8s_ctrlplane_host must be defined for worker host {{ inventory_hostname }}"

# コントロールプレーンへの到達性確認を行う
- name: Probe associated control plane host for kubeconfig distribution
  ansible.builtin.wait_for_connection:
    timeout: "{{ k8s_kubeconfig_probe_timeout | default(15,true) }}"
    connect_timeout: "{{ k8s_kubeconfig_probe_connect_timeout | default(5,true) }}"
    sleep: "{{ k8s_kubeconfig_probe_sleep | default(1,true) }}"
    delay: "{{ k8s_kubeconfig_probe_delay | default(0,true) }}"
  delegate_to: "{{ k8s_ctrlplane_host }}"
  register: k8s_kubeconfig_probe_result
  until: k8s_kubeconfig_probe_result is succeeded
  retries: "{{ k8s_kubeconfig_probe_retries | default(8,true) }}"
  delay: "{{ k8s_kubeconfig_probe_retry_interval | default(10,true) }}"

# 共通で利用するローカルキャッシュディレクトリを決定
- name: Define local staging directory for kubeconfig artifacts
  ansible.builtin.set_fact:
    k8s_kubeconfig_local_cache_dir: "{{ lookup('env', 'HOME') }}/.ansible/kubeconfig-cache"
    k8s_kubeconfig_local_cache_owner: "{{ lookup('env', 'USER') }}"
    k8s_kubeconfig_local_cache_group: "{{ lookup('pipe', 'id -gn') }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true

# ローカルキャッシュディレクトリを作成
- name: Ensure local kubeconfig cache directory exists
  ansible.builtin.file:
    path: "{{ hostvars['localhost']['k8s_kubeconfig_local_cache_dir'] }}"
    state: directory
    mode: "0700"
    owner: "{{ hostvars['localhost']['k8s_kubeconfig_local_cache_owner'] }}"
    group: "{{ hostvars['localhost']['k8s_kubeconfig_local_cache_group'] }}"
    recurse: true
  delegate_to: localhost
  become: true
  run_once: true

- name: Define worker-specific kubeconfig cache file
  ansible.builtin.set_fact:
    k8s_kubeconfig_local_cache_file: "{{ hostvars['localhost']['k8s_kubeconfig_local_cache_dir'] }}/{{ k8s_ctrlplane_host }}-{{ inventory_hostname }}-{{ k8s_kubeconfig_merged_filename }}"

# コントロールプレーンから統合済み kubeconfig を取得
- name: Fetch merged kubeconfig from control plane
  ansible.builtin.fetch:
    src: "{{ k8s_kubeconfig_merged_system_path }}"
    dest: "{{ k8s_kubeconfig_local_cache_file }}"
    flat: true
  delegate_to: "{{ k8s_ctrlplane_host }}"

# 各ワーカーノードで統合済み kubeconfig を設置
- name: Deploy merged kubeconfig to worker
  ansible.builtin.copy:
    src: "{{ k8s_kubeconfig_local_cache_file }}"
    dest: "{{ k8s_kubeconfig_merged_operator_path }}"
    owner: "{{ k8s_operator_user }}"
    group: "{{ k8s_operator_user }}"
    mode: "0600"

# Helm実行候補ユーザ全員へ統合kubeconfigを配布し, クラスタ横断操作の参照先を統一する。
- name: Resolve kubeconfig distribution users for worker
  ansible.builtin.set_fact:
    k8s_kubeconfig_distribution_users: >-
      {{
        (
          [k8s_operator_user | default('', true) | string | trim]
          +
          (k8s_common_helm_execution_users | default([], true))
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}
  changed_when: false

# 複数ユーザ配布で実ホームを参照できるように, 配布対象ユーザのホーム対応を解決する。
- name: Include distribution user home resolution tasks for worker
  ansible.builtin.include_tasks:
    file: resolve-distribution-user-home-map.yml

# 複数ユーザ配布先の実ホームを使用し, /home 固定前提による配置先不整合を防止する。
- name: Ensure kubeconfig directory exists for distribution users on worker
  ansible.builtin.file:
    path: "{{ k8s_kubeconfig_distribution_user_home_map[item] }}/.kube"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ k8s_kubeconfig_distribution_users | default([], true) }}"

# 複数ユーザ配布先の実ホームを使用し, 統合 kubeconfig の参照先を実環境と一致させる。
- name: Deploy merged kubeconfig to distribution users on worker
  ansible.builtin.copy:
    src: "{{ k8s_kubeconfig_local_cache_file }}"
    dest: "{{ k8s_kubeconfig_distribution_user_home_map[item] }}/.kube/{{ k8s_kubeconfig_merged_filename }}"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ k8s_kubeconfig_distribution_users | default([], true) }}"

# システムディレクトリにも配置し, root から参照可能にする
- name: Copy merged kubeconfig to system directory
  ansible.builtin.copy:
    src: "{{ k8s_kubeconfig_local_cache_file }}"
    dest: "{{ k8s_kubeconfig_merged_system_path }}"
    owner: "root"
    group: "root"
    mode: "0600"
