#  -*- coding:utf-8 mode:yaml -*-
#  Ansible playbook
#
#  kubeconfig シンボリックリンク整備タスク
#
---

# 既存の kubeconfig を調査し, 必要に応じて退避
- name: Inspect existing operator kubeconfig
  ansible.builtin.stat:
    path: "{{ k8s_kubeconfig_operator_config_path }}"
  register: k8s_kubeconfig_operator_config_stat

# kubeconfig参照先を統一するため, operatorユーザを含む対象一覧を解決する。
- name: Resolve kubeconfig symlink users
  ansible.builtin.set_fact:
    k8s_kubeconfig_symlink_users: >-
      {{
        (
          (
            [k8s_operator_user | default('', true) | string | trim]
            +
            (k8s_common_helm_execution_users | default([], true))
          )
          | map('string')
          | map('trim')
          | reject('equalto', '')
          | unique
          | list
        )
      }}
  changed_when: false

# 既存ファイルが通常ファイルでバックアップが未作成なら控えを作る
- name: Backup current operator kubeconfig if needed
  ansible.builtin.copy:
    src: "{{ k8s_kubeconfig_operator_config_path }}"
    dest: "{{ k8s_kubeconfig_admin_backup_path }}"
    owner: "{{ k8s_operator_user }}"
    group: "{{ k8s_operator_user }}"
    mode: "0600"
    remote_src: true
  when:
    - k8s_kubeconfig_operator_config_stat.stat.exists
    - not k8s_kubeconfig_operator_config_stat.stat.islnk

# シンボリックリンク作成前に従来ファイルを除去
- name: Remove legacy operator kubeconfig file
  ansible.builtin.file:
    path: "{{ k8s_kubeconfig_operator_config_path }}"
    state: absent
  when:
    - k8s_kubeconfig_operator_config_stat.stat.exists
    - not k8s_kubeconfig_operator_config_stat.stat.islnk

# クラスタ横断操作時の既定参照先を揃えるため, 対象ユーザのconfigを統合kubeconfigへリンクする。
- name: Create kubeconfig symlink to merged file for symlink users
  ansible.builtin.file:
    src: "{{ k8s_kubeconfig_merged_filename }}"
    dest: "/home/{{ item }}/.kube/config"
    state: link
    owner: "{{ item }}"
    group: "{{ item }}"
    force: true
  loop: "{{ k8s_kubeconfig_symlink_users | default([], true) }}"
