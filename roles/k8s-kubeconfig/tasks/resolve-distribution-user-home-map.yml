#  -*- coding:utf-8 mode:yaml -*-
#  Ansible playbook
#
#  kubeconfig 配布先ユーザのホームディレクトリ解決タスク
#
---

# 配布対象ユーザごとのホームディレクトリ対応を初期化する。
- name: Initialize home directory map for kubeconfig distribution users
  ansible.builtin.set_fact:
    k8s_kubeconfig_distribution_user_home_map: {}
  changed_when: false

# 複数ユーザ配布で /home 固定前提を避けるため, 配布対象ユーザの passwd 情報を取得する。
- name: Resolve passwd entries for kubeconfig distribution users
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
  loop: "{{ k8s_kubeconfig_distribution_users | default([], true) }}"
  register: k8s_kubeconfig_distribution_users_getent
  changed_when: false

# getent 結果からホームディレクトリ辞書を構築し, 配布先パスで一貫利用できるようにする。
- name: Build home directory map for kubeconfig distribution users
  ansible.builtin.set_fact:
    k8s_kubeconfig_distribution_user_home_map: >-
      {{
        k8s_kubeconfig_distribution_user_home_map | default({}, true) |
        combine({ item.item: item.ansible_facts.getent_passwd[item.item][4] })
      }}
  loop: "{{ k8s_kubeconfig_distribution_users_getent.results | default([], true) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not item.skipped | default(false)
    - item.ansible_facts is defined
    - item.ansible_facts.getent_passwd is defined
  changed_when: false
