#
#  タスクメイン部
#
#  include_tasksで他のタスクを読み込む
#
---

# 最初に変数設定を読み直す ( role単独で実行可能とするため )
- name: "Load Params"
  ansible.builtin.include_tasks: load-params.yml

#
# Gitlab関連のタスクは, 以下の条件で動作する
# - (典型的な場合には`host_vars`で) gitlab_enabledがtrueに設定されていること, かつ,
# - gitlab_hostname変数が定義されており, 空文字列でないこと
#

# パッケージ導入処理
- name: "Package"
  ansible.builtin.include_tasks: package.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# サービス停止タスクを最初に実行する
- name: "Stop Service"
  ansible.builtin.include_tasks: stop-service.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# クリーンインストール指示がある場合の処理をディレクトリ
# 作成処理の前に実行する
- name: "Config Clean Install"
  ansible.builtin.include_tasks: config-clean-install.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# ディレクトリ作成処理
- name: "Directory"
  ansible.builtin.include_tasks: directory.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# Gitlab固有ディレクトリ作成処理
- name: "Directory Gitlab"
  ansible.builtin.include_tasks: directory-gitlab.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# ユーザ, グループ作成関連処理
- name: "User Group"
  ansible.builtin.include_tasks: user_group.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# sysctl設定をサービス起動前に適用
- name: "Sysctl"
  ansible.builtin.include_tasks: sysctl.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# サービス起動処理
- name: "Service"
  ansible.builtin.include_tasks: service.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# サービス以外の設定ファイル作成処理
- name: "Config"
  ansible.builtin.include_tasks: config.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0

# Gitlab Runner 用 docker設定処理
- name: "Config Docker"
  ansible.builtin.include_tasks: config-docker.yml
  when:
    - gitlab_enabled | default(false) | bool
    - gitlab_hostname | default('', true) | length > 0
