---

# Elasticsearch 実行に必要なパス, コンテナイメージ名, ポート, 対象 OS を検証する。
# 文字列入力の検証は, 未定義時に空文字へ置換(default('', true)) -> 文字列化(string) -> 前後空白除去(trim) -> 文字数判定(length) の順で実施する。
- name: Validate elasticsearch runtime inputs
  ansible.builtin.assert:
    that:
      - (elastic_search_compose_dir | default('', true) | string | trim | length) > 0
      - (elastic_search_compose_file | default('', true) | string | trim | length) > 0
      - (elastic_search_config_file | default('', true) | string | trim | length) > 0
      - (elastic_search_data_dir | default('', true) | string | trim | length) > 0
      - (elastic_search_logs_dir | default('', true) | string | trim | length) > 0
      - (elastic_search_image | default('', true) | string | trim | length) > 0
      - (elastic_search_network_name | default('', true) | string | trim | length) > 0
      - (elastic_search_sysctl_dropin_file | default('', true) | string | trim | length) > 0
      - (elastic_search_vm_max_map_count | int) >= 262144
      - (elastic_search_http_port | int) > 0
      - (elastic_search_http_port | int) < 65536
      - ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Invalid elasticsearch settings. Ensure paths, image, port, and OS family
      are configured correctly.

# バックアップ有効時の入力値を検証し, 実行時エラーを事前に防止する。
- name: Validate elasticsearch backup settings
  ansible.builtin.assert:
    that:
      - (elastic_search_scripts_dir | default('', true) | string | trim | length) > 0
      - (elastic_search_backup_dir | default('', true) | string | trim | length) > 0
      - (elastic_search_snapshot_repository | default('', true) | string | trim | length) > 0
      - (elastic_search_snapshot_repo_path_host | default('', true) | string | trim | length) > 0
      - (elastic_search_snapshot_repo_path_container | default('', true) | string | trim | length) > 0
      - (elastic_search_python_command | default('', true) | string | trim | length) > 0
      - (elastic_search_backup_retention | int) > 0
    fail_msg: >-
      Invalid elasticsearch backup settings. Ensure script paths, repository
      settings, python command, and retention are configured correctly.
  when:
    - elastic_search_enable_backup_script | default(false) | bool
