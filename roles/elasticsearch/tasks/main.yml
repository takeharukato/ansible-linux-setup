#
#  タスクメイン部
#
#  include_tasksで他のタスクを読み込む
#
---

# 最初に変数設定を読み直し, role 単独で実行しても参照変数を確定する。
- name: "Load Params"
  ansible.builtin.include_tasks: load-params.yml

# endpoint と TLS 検証モードの実行時方針を先に確定する。
- name: "Resolve Runtime Flags"
  ansible.builtin.include_tasks: resolve-runtime-flags.yml
  when:
    - elastic_search_enabled | default(true) | bool

# 実行時に確定する endpoint 検証用の内部変数を先に解決する。
- name: "Resolve Runtime Vars"
  ansible.builtin.include_tasks: resolve-runtime-vars.yml
  when:
    - elastic_search_enabled | default(true) | bool

# Elasticsearch の導入前提を確認し, 実行基盤の不足を早期に検出する。
- name: "Validate"
  ansible.builtin.include_tasks: validate.yml
  when:
    - elastic_search_enabled | default(true) | bool

# docker compose の利用可否を確認し, コンテナ起動が可能であることを保証する。
- name: "Package"
  ansible.builtin.include_tasks: package.yml
  when:
    - elastic_search_enabled | default(true) | bool

# package タスクで sysctl ドロップインが更新された場合は, 起動前に反映する。
- name: "Apply Pending Handlers After Package"
  ansible.builtin.meta: flush_handlers
  when:
    - elastic_search_enabled | default(true) | bool

# compose 用ディレクトリと永続化領域を作成し, 設定配置先を整える。
- name: "Directory"
  ansible.builtin.include_tasks: directory.yml
  when:
    - elastic_search_enabled | default(true) | bool

# 実行ユーザとグループを作成し, ディレクトリ所有権を整える。
- name: "User Group"
  ansible.builtin.include_tasks: user_group.yml
  when:
    - elastic_search_enabled | default(true) | bool

# compose 定義と Elasticsearch 設定ファイルを生成し, 起動設定を固定する。
- name: "Config"
  ansible.builtin.include_tasks: config.yml
  when:
    - elastic_search_enabled | default(true) | bool

# 共有ネットワークを作成し, コンテナを起動して待受状態へ遷移させる。
- name: "Service"
  ansible.builtin.include_tasks: service.yml
  when:
    - elastic_search_enabled | default(true) | bool

# 起動済みサービスの待受と応答を確認し, backend として利用可能であることを検証する。
- name: "Verify"
  ansible.builtin.include_tasks: verify.yml
  when:
    - elastic_search_enabled | default(true) | bool
