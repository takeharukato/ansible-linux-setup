#
#  ロール固有変数のデフォルト値
#  group_vars/all/all.yml やhost_varsで上書き可能とするため,
#  ロール名/defaults/main.yml に定義している
---

# Elasticsearch ロールを有効化する。
elastic_search_enabled: true

#
# Elasticsearch コンテナの実行基盤設定
#
# docker compose ファイルを配置するディレクトリ
elastic_search_compose_dir: "/srv/elastic-search"

#
# Elasticsearch イメージと設定
#
# Elasticsearch クラスタ名
elastic_search_cluster_name: "shared-logs"
# Elasticsearch ノード名
elastic_search_node_name: "{{ inventory_hostname }}"
# Elasticsearch の discovery.type 設定値
# Docker Compose で単一ノード構成で起動するため, "single-node" を指定
elastic_search_discovery_type: "single-node"
# Elasticsearch transport層TLS有効化フラグ。
elastic_search_transport_ssl_enabled: false

# Elasticsearch の起動前提となるカーネルパラメータ設定値
# vm.max_map_count の値 (利用可能なメモリ領域数の最大値) を設定する必要がある。
# 参考: Maximum map count check
#   https://www.elastic.co/guide/en/elasticsearch/reference/8.17/bootstrap-checks-max-map-count.html
elastic_search_vm_max_map_count: 262144
# Elasticsearch の起動前提となるカーネルパラメータ設定を反映する sysctl ドロップインファイルのパス
elastic_search_sysctl_dropin_file: "/etc/sysctl.d/90-elasticsearch.conf"
# Elasticsearch の HTTP 接続バインドアドレス
elastic_search_http_host: "0.0.0.0"
# Elasticsearch HTTP層TLS証明書(ホスト側)のコンポーネント別上書き設定。
# 未指定時は logging backend 共通証明書設定を使用する。
elastic_search_http_ssl_certificate_host_path: ""
# Elasticsearch HTTP層TLS秘密鍵(ホスト側)のコンポーネント別上書き設定。
# 未指定時は logging backend 共通秘密鍵設定を使用する。
elastic_search_http_ssl_key_host_path: ""
# Elasticsearch HTTP層TLS証明書のコンテナ内参照パス。
elastic_search_http_ssl_certificate_container_path: "/usr/share/elasticsearch/config/http-certs/tls.crt"
# Elasticsearch HTTP層TLS秘密鍵のコンテナ内参照パス。
elastic_search_http_ssl_key_container_path: "/usr/share/elasticsearch/config/http-certs/tls.key"
# Elasticsearch の java オプション設定値
# 最小ヒープサイズと最大ヒープサイズを同一値(512MiB)に設定(Elasticsearch 8.0以降の推奨値)。
elastic_search_java_opts: "-Xms512m -Xmx512m"

#
# 起動検証設定
#
# Elasticsearch コンテナの起動検証時の接続先ホスト名/IPアドレス
elastic_search_wait_host: "127.0.0.1"
# Elasticsearch コンテナの起動検証時の接続元ホスト名/IPアドレス (対象ホスト)
elastic_search_wait_delegate_to: "{{ inventory_hostname }}"
# Elasticsearch コンテナの起動検証時のタイムアウト値 (単位: 秒)
elastic_search_wait_timeout: 120
# Elasticsearch コンテナの起動検証時の待機間隔 (単位: 秒)
elastic_search_wait_delay: 5
# Elasticsearch コンテナの起動検証時のポーリング周期 (単位: 秒)
elastic_search_wait_sleep: 2
# Elasticsearch コンテナの起動検証時の再試行回数 (単位: 回)
elastic_search_wait_retries: 60
# Elasticsearch cluster health 検証の1回あたり要求タイムアウト値 (単位: 秒)
elastic_search_health_request_timeout_seconds: 10
# Elasticsearch cluster health 検証の再試行間隔 (単位: 秒)
elastic_search_health_retry_interval_seconds: 5
# Elasticsearch cluster health 検証の再試行回数 (単位: 回)
# 実環境が開発環境より2-4倍遅い前提で, 最大約25分(5秒 * 300回)の待機予算を確保する。
elastic_search_health_retries: 300

#
# バックアップ/リストア関連設定
#
# バックアップ関連スクリプト生成有効化フラグ
elastic_search_enable_backup_script: false
# Snapshot Repository 名
elastic_search_snapshot_repository: "elastic-backup-repo"
# Snapshot Repository のコンテナ側パス
elastic_search_snapshot_repo_path_container: "/usr/share/elasticsearch/snapshot-repo"
# バックアップ名接頭辞
elastic_search_backup_name_prefix: "elastic-snapshot"
# 保持世代数 (単位: 世代)
elastic_search_backup_retention: 7
# Python 実行コマンド
elastic_search_python_command: "/usr/bin/python3"
# 日次バックアップへ追加する引数
elastic_search_daily_backup_extra_args: ""
