#
#  Elasticsearch再起動ハンドラ
#
---

# 設定変更時に compose を再適用し, Elasticsearch コンテナを再作成する。
- name: Restart elasticsearch service
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ elastic_search_compose_file }}"
      - up
      - -d
      - --force-recreate
      - --remove-orphans
  args:
    chdir: "{{ elastic_search_compose_dir }}"
  become: true
  changed_when: true
  listen: elasticsearch_restart_service
