---

# チェックモードでは実行時検証を行わない。
- name: Skip fleet-server runtime verification in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode: skipping runtime verification for fleet-server.
  when: ansible_check_mode | bool

# fleet-server コンテナが稼働状態へ遷移したことを確認する。
- name: Inspect fleet-server container state
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - "{{ fleet_server_container_name }}"
  register: fleet_server_container_state_cmd
  changed_when: false
  until:
    - fleet_server_container_state_cmd is succeeded
    - fleet_server_container_state_cmd.stdout | length > 0
    - ((fleet_server_container_state_cmd.stdout | from_json | first).State.Running | default(false)) | bool
  retries: "{{ fleet_server_wait_retries }}"
  delay: "{{ fleet_server_wait_sleep }}"
  when: not (ansible_check_mode | bool)

# コンテナが稼働状態であることを最終確認し, 異常終了ループを検出する。
- name: Assert fleet-server container is running
  ansible.builtin.assert:
    that:
      - ((fleet_server_container_state_cmd.stdout | from_json | first).State.Running | default(false)) | bool
    fail_msg: >-
      fleet-server container is not running.
      container={{ fleet_server_container_name }}
  when: not (ansible_check_mode | bool)

# fleet-server の待受ポートが開くまで待機する。
- name: Wait for fleet-server port
  ansible.builtin.wait_for:
    host: "{{ fleet_server_wait_host }}"
    port: "{{ fleet_server_port }}"
    state: started
    timeout: "{{ fleet_server_wait_timeout }}"
    delay: "{{ fleet_server_wait_delay }}"
    sleep: "{{ fleet_server_wait_sleep }}"
  delegate_to: "{{ fleet_server_wait_delegate_to }}"
  register: fleet_server_wait_result
  until: fleet_server_wait_result is succeeded
  retries: "{{ fleet_server_wait_retries }}"
  delay: "{{ fleet_server_wait_sleep }}"
  when: not (ansible_check_mode | bool)

# Bootstrap実行前はAgent ID未生成を許容し, それ以外の異常状態が解消するまで再試行する。
- name: Check fleet-server elastic-agent runtime status
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ fleet_server_container_name }}"
      - elastic-agent
      - status
      - --output
      - json
  register: fleet_server_agent_status_cmd
  changed_when: false
  failed_when: false
  until:
    - >-
      (
        (fleet_server_agent_status_cmd.rc == 0) and
        ((fleet_server_agent_status_cmd.stdout | from_json).state | int < 3)
      ) or (
        (fleet_server_runtime_bootstrap_enabled | bool) and
        (((fleet_server_agent_status_cmd.stdout | from_json).info.id | default('')) | length == 0) and
        ('missing config fleet.agent.id' in fleet_server_agent_status_cmd.stdout)
      )
  retries: "{{ fleet_server_wait_retries }}"
  delay: "{{ fleet_server_wait_sleep }}"
  when: not (ansible_check_mode | bool)

# 後続Bootstrapで回復するAgent ID未生成状態を除き, FAILED/DEGRADEDを明示的に失敗として扱う。
- name: Assert fleet-server elastic-agent runtime status is healthy
  ansible.builtin.assert:
    that:
      - >-
        (
          (fleet_server_agent_status_cmd.rc == 0) and
          ((fleet_server_agent_status_cmd.stdout | from_json).state | int < 3)
        ) or (
          (fleet_server_runtime_bootstrap_enabled | bool) and
          (((fleet_server_agent_status_cmd.stdout | from_json).info.id | default('')) | length == 0) and
          ('missing config fleet.agent.id' in fleet_server_agent_status_cmd.stdout)
        )
    fail_msg: >-
      fleet-server elastic-agent runtime is not healthy.
      rc={{ fleet_server_agent_status_cmd.rc }}
      state={{ ((fleet_server_agent_status_cmd.stdout | default('{}')) | from_json).state | default('unknown') }}
      message={{ ((fleet_server_agent_status_cmd.stdout | default('{}')) | from_json).message | default('unknown') }}
  when: not (ansible_check_mode | bool)

# 実行時に生成または再利用した Kibana API キーがコンテナへ引き渡されていることを確認する。
- name: Assert fleet-server API key is propagated to the container
  ansible.builtin.assert:
    that:
      - fleet_server_kibana_api_key_value | default('', true) | trim | length > 0
      - >-
        (
          (fleet_server_container_state_cmd.stdout | from_json | first).Config.Env
          | default([])
          | select('match', '^FLEET_SERVER_KIBANA_API_KEY=')
          | list
          | length
        ) > 0
    fail_msg: >-
      fleet-server container did not receive the generated Kibana API key.
  when:
    - not (ansible_check_mode | bool)
    - fleet_server_runtime_elasticsearch_security_enabled | default(false) | bool
