#  frrパッケージ関連処理
---

# 共通FRR導入処理 (frr_version指定時はソースビルド経路)
- name: Include frr-common role for FRR package/service
  ansible.builtin.include_role:
    name: frr-common
    tasks_from: package.yml

# IPv4/IPv6 フォワーディング有効化用 sysctl ドロップイン配置
- name: Deploy IPv4/IPv6 forwarding sysctl drop-in
  ansible.builtin.template:
    src: "90-frr-forwarding.conf.j2"
    dest: "/etc/sysctl.d/90-frr-forwarding.conf"
    owner: root
    group: root
    mode: "0644"
  notify: "reload_sysctl"

# FRR設定ファイル配置
- name: Deploy FRR configuration
  ansible.builtin.template:
    src: "frr.conf.j2"
    dest: "/etc/frr/frr.conf"
    owner: frr
    group: "{{ frr_group | default('frr', true) }}"
    mode: "0640"
  notify: "restart_frr"

# zebra/bgpd を有効化するための/etc/frr/daemonsファイルを配置
- name: Enable zebra/bgpd via /etc/frr/daemons
  ansible.builtin.template:
    src: "daemons.j2"
    dest: "/etc/frr/daemons"
    owner: root
    group: "{{ frr_group | default('frr', true) }}"
    mode: "0640"
  notify: "restart_frr"

# FRRサービスを有効化して起動する
# 起動失敗時は systemd と journal の要点を採取して原因を可視化する
- name: Enable and start FRR service
  block:
    # FRRサービスを有効化して起動する
    - name: Start FRR service
      ansible.builtin.service:
        name: "{{ frr_svc_name }}"
        enabled: true
        state: started
  rescue:
    # FRRサービス起動失敗時の systemd 状態を採取する
    - name: Collect FRR service status details on failure
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - "{{ frr_svc_name }}"
          - --no-pager
          - --full
      register: frr_service_status_on_failure
      changed_when: false
      failed_when: false

    # FRRサービス起動失敗時の journal を採取する
    - name: Collect FRR journal details on failure
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ frr_svc_name }}"
          - -n
          - "200"
          - --no-pager
      register: frr_service_journal_on_failure
      changed_when: false
      failed_when: false

    # FRRサービス起動失敗時に systemd と journal の要点を表示して終了する
    - name: Fail with FRR runtime diagnostics
      ansible.builtin.fail:
        msg: |-
          Failed to start {{ frr_svc_name }}.
          systemctl status output:
          {{ frr_service_status_on_failure.stdout | default('') }}
          {{ frr_service_status_on_failure.stderr | default('') }}
          journalctl -u {{ frr_svc_name }} -n 200 output:
          {{ frr_service_journal_on_failure.stdout | default('') }}
          {{ frr_service_journal_on_failure.stderr | default('') }}
