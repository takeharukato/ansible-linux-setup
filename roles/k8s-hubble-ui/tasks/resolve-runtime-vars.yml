---

# Hubble UIは既存Cilium releaseを更新するため,
# Cilium初期導入と同じ共通Helm代表ユーザ及びrelease情報を使用する。
# Helm操作の時間制限と再試行設定も共通設定を使用する。
- name: Resolve runtime Helm values for Hubble UI
  ansible.builtin.set_fact:
    k8s_hubble_ui_runtime_release_name: "cilium"
    k8s_hubble_ui_runtime_namespace: "kube-system"
    k8s_hubble_ui_runtime_operator_user: >-
      {{ k8s_runtime_helm_operator_user | string | trim }}
    k8s_hubble_ui_runtime_chart_ref: "cilium/cilium"
    k8s_hubble_ui_runtime_chart_version: >-
      {{ hubble_ui_version | string | trim }}
    k8s_hubble_ui_runtime_helm_timeout_seconds: >-
      {{ k8s_helm_timeout_seconds | int }}
    k8s_hubble_ui_runtime_helm_retries: >-
      {{ k8s_helm_retries | int }}
    k8s_hubble_ui_runtime_helm_retry_interval_seconds: >-
      {{ k8s_helm_retry_interval_seconds | int }}
    k8s_hubble_ui_runtime_helm_request_interval_seconds: >-
      {{ k8s_helm_request_interval_seconds | int }}
  changed_when: false

# kubeconfig参照先を解決する前提として,
# Hubble UIの共通Helm代表ユーザ名が空でないことを確認する。
- name: Validate Hubble UI Helm operator user input
  ansible.builtin.assert:
    that:
      - >-
        k8s_hubble_ui_runtime_operator_user
        | default('', true)
        | string
        | trim
        | length > 0
    fail_msg: >-
      Kubernetes Helm operator user is not configured for Hubble UI.

# k8s-kubeconfigがca-embedded-admin.confを配布した実ホームを使用するため,
# 共通Helm代表ユーザのpasswd情報を取得する。
- name: Resolve home directory for Hubble UI Helm operator user
  ansible.builtin.getent:
    database: passwd
    key: "{{ k8s_hubble_ui_runtime_operator_user | string | trim }}"
    fail_key: false
  register: k8s_hubble_ui_operator_user_getent
  changed_when: false

# ユーザ不存在時も後続assertで原因を明示できるよう,
# getent結果からpasswdエントリを空listへ正規化して取り出す。
- name: Resolve Hubble UI Helm operator passwd entry
  ansible.builtin.set_fact:
    k8s_hubble_ui_operator_user_passwd_entry: >-
      {{
        (
          k8s_hubble_ui_operator_user_getent
          .ansible_facts
          .getent_passwd
          | default({})
        ).get(
          k8s_hubble_ui_runtime_operator_user | string | trim,
          []
        )
        | default([], true)
      }}
  changed_when: false

# 共通Helm代表ユーザの実ホームを安全に参照できることを確認する。
- name: Validate Hubble UI Helm operator user
  ansible.builtin.assert:
    that:
      - k8s_hubble_ui_operator_user_passwd_entry | length > 4
      - >-
        (
          (
            k8s_hubble_ui_operator_user_passwd_entry
            + ['', '', '', '', '']
          )[4]
          | default('', true)
          | string
          | trim
          | length
        ) > 0
    fail_msg: >-
      Kubernetes Helm operator user {{ k8s_hubble_ui_runtime_operator_user }} does not have valid passwd information.

# k8s-kubeconfigがHelm実行候補ユーザへ配布した証明書埋め込み版kubeconfigを,
# get-valuesとupgrade/installの両方で同じ実行ユーザから参照する。
- name: Resolve Hubble UI runtime kubeconfig path
  ansible.builtin.set_fact:
    k8s_hubble_ui_runtime_kubeconfig_path: >-
      {{
        k8s_hubble_ui_operator_user_passwd_entry[4]
        ~ '/.kube/ca-embedded-admin.conf'
      }}
  changed_when: false
