---

# kube-apiが使えるようになるのを待ち合わせる
- name: Wait for kube-api-server
  ansible.builtin.wait_for:
    host: "{{ k8s_api_wait_host }}"
    port: "{{ k8s_api_wait_port }}"
    state: started
    timeout: "{{ k8s_api_wait_timeout }}"
    delay: "{{ k8s_api_wait_delay }}"
    sleep: "{{ k8s_api_wait_sleep }}"
  delegate_to: "{{ k8s_api_wait_delegate_to }}"
  register: k8s_hubble_api_wait_result
  until: k8s_hubble_api_wait_result is succeeded
  retries: "{{ k8s_api_wait_retries | default(5) }}"
  delay: "{{ k8s_api_wait_sleep }}"
- name: Wait for Cilium CRD availability
  ansible.builtin.command: kubectl --kubeconfig {{ k8s_admin_kubeconfig_path }} get crd ciliumidentities.cilium.io
  register: cilium_crd_check
  until: cilium_crd_check.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  become: true

# Hubble Relay の存在確認
- name: Check if Hubble Relay is deployed
  ansible.builtin.command: kubectl --kubeconfig {{ k8s_admin_kubeconfig_path }} get deployment -n kube-system hubble-relay
  register: hubble_relay_check
  failed_when: false
  changed_when: false
  become: true

# Hubble Relay が存在しない場合は警告を表示
- name: Warn if Hubble Relay is not enabled
  ansible.builtin.debug:
    msg: "WARNING: Hubble Relay is not enabled. Hubble UI requires Hubble Relay to function properly."
  when: hubble_relay_check.rc != 0

# Hubble UI 設定ファイル格納ディレクトリを作成
- name: Create Hubble UI config directory
  ansible.builtin.file:
    path: "{{ k8s_hubble_ui_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

# Hubble UI 用 values ファイルを生成
- name: Setup Hubble UI values file
  ansible.builtin.template:
    src: hubble-ui-values.yml.j2
    dest: "{{ k8s_hubble_ui_config_dir }}/hubble-ui-values.yml"
    owner: root
    group: root
    mode: '0644'
    backup: false
  become: true

# 既存Cilium releaseの利用者設定valuesを共通Helm代表ユーザで取得し,
# Hubble UI設定をマージして既存Cilium設定を保持する。
- name: Get existing Cilium Helm values via k8s-helm-common
  vars:
    k8s_helm_release_name: "{{ k8s_hubble_ui_runtime_release_name }}"
    k8s_helm_namespace: "{{ k8s_hubble_ui_runtime_namespace }}"
    k8s_helm_kubeconfig_path: "{{ k8s_hubble_ui_runtime_kubeconfig_path }}"
    k8s_helm_get_values_all: false
    k8s_helm_operation_timeout_seconds: "{{ k8s_hubble_ui_runtime_helm_timeout_seconds }}"
    k8s_helm_operation_retries: "{{ k8s_hubble_ui_runtime_helm_retries }}"
    k8s_helm_operation_retry_interval_seconds: "{{ k8s_hubble_ui_runtime_helm_retry_interval_seconds }}"
    k8s_helm_operation_request_interval_seconds: "{{ k8s_hubble_ui_runtime_helm_request_interval_seconds }}"
  when: hubble_ui_merge_existing_values | default(false)
  block:
    - name: Get Cilium Helm values with common role
      ansible.builtin.include_role:
        name: k8s-helm-common
        tasks_from: get-values.yml

# 既存 values を一時ファイルに保存 (取得成功かつ空でない場合)
- name: Save existing values to file
  ansible.builtin.copy:
    content: "{{ k8s_helm_release_values_yaml }}"
    dest: "{{ k8s_hubble_ui_config_dir }}/cilium-existing-values.yml"
    owner: root
    group: root
    mode: '0644'
  become: true
  when:
    - hubble_ui_merge_existing_values | default(false)
    - k8s_helm_get_values_result.rc == 0
    - k8s_helm_release_values_yaml | length > 0

# 既存値と新規値をマージ (yq使用)
# 新規値（Hubble UI設定）を優先するため、右側（fileIndex==1）を後にマージ
- name: Merge existing values with Hubble UI values
  ansible.builtin.shell: |
    set -o pipefail
    set -ex
    {{ yq_command }} eval-all '. as $item ireduce ({}; . * $item)' \
      "{{ k8s_hubble_ui_config_dir }}/cilium-existing-values.yml" \
      "{{ k8s_hubble_ui_config_dir }}/hubble-ui-values.yml" \
      > "{{ k8s_hubble_ui_config_dir }}/hubble-ui-values-merged.yml" 2>&1
  args:
    executable: /bin/bash
  register: yq_merge_result
  changed_when: yq_merge_result.rc == 0
  become: true
  when:
    - hubble_ui_merge_existing_values | default(false)
    - k8s_helm_get_values_result.rc == 0
    - k8s_helm_release_values_yaml | length > 0

# マージ結果をデバッグ表示
- name: Display yq merge result
  ansible.builtin.debug:
    var: yq_merge_result
  when:
    - hubble_ui_merge_existing_values | default(false)
    - k8s_helm_get_values_result.rc == 0
    - k8s_helm_release_values_yaml | length > 0

# マージ結果を確認
- name: Check merged values file
  ansible.builtin.stat:
    path: "{{ k8s_hubble_ui_config_dir }}/hubble-ui-values-merged.yml"
  register: merged_file_stat
  become: true
  when:
    - hubble_ui_merge_existing_values | default(false)
    - k8s_helm_get_values_result.rc == 0
    - k8s_helm_release_values_yaml | length > 0

# マージファイルが空の場合は警告を表示
- name: Warn if merged file is empty
  ansible.builtin.debug:
    msg: "WARNING: Merged values file is empty. Will use hubble-ui-values.yml instead."
  when:
    - hubble_ui_merge_existing_values | default(false)
    - k8s_helm_get_values_result.rc == 0
    - k8s_helm_release_values_yaml | length > 0
    - merged_file_stat.stat.exists
    - merged_file_stat.stat.size == 0

# 使用する values ファイルを決定
- name: Set Helm values file path
  ansible.builtin.set_fact:
    hubble_ui_helm_values_file: >-
      {{
        (hubble_ui_merge_existing_values | default(false) and
         k8s_helm_get_values_result.rc == 0 and
         k8s_helm_release_values_yaml | length > 0 and
         merged_file_stat.stat.exists and
         merged_file_stat.stat.size > 0)
        | ternary(
            k8s_hubble_ui_config_dir + '/hubble-ui-values-merged.yml',
            k8s_hubble_ui_config_dir + '/hubble-ui-values.yml'
          )
      }}
  changed_when: false

# Cilium初期導入と同じ共通Helm代表ユーザで同一releaseを更新し,
# Hubble UI有効化後もrepository設定とrelease所有操作の実行ユーザを統一する。
- name: Enable Hubble UI via k8s-helm-common
  vars:
    k8s_helm_release_name: "{{ k8s_hubble_ui_runtime_release_name }}"
    k8s_helm_namespace: "{{ k8s_hubble_ui_runtime_namespace }}"
    k8s_helm_chart_ref: "{{ k8s_hubble_ui_runtime_chart_ref }}"
    k8s_helm_chart_version: "{{ k8s_hubble_ui_runtime_chart_version }}"
    k8s_helm_kubeconfig_path: "{{ k8s_hubble_ui_runtime_kubeconfig_path }}"
    k8s_helm_values_files:
      - "{{ hubble_ui_helm_values_file }}"
    k8s_helm_create_namespace: false
    k8s_helm_wait: true
    k8s_helm_operation_timeout_seconds: "{{ k8s_hubble_ui_runtime_helm_timeout_seconds }}"
    k8s_helm_operation_retries: "{{ k8s_hubble_ui_runtime_helm_retries }}"
    k8s_helm_operation_retry_interval_seconds: "{{ k8s_hubble_ui_runtime_helm_retry_interval_seconds }}"
    k8s_helm_operation_request_interval_seconds: "{{ k8s_hubble_ui_runtime_helm_request_interval_seconds }}"
  block:
    - name: Install or upgrade Cilium Helm release for Hubble UI
      ansible.builtin.include_role:
        name: k8s-helm-common
        tasks_from: upgrade.yml

    # 共通upgrade処理は失敗結果を呼出元へ返すため,
    # 従来のhelm upgradeと同様に非0終了時はHubble UI設定を停止する。
    - name: Validate Hubble UI Helm upgrade result
      ansible.builtin.assert:
        that:
          - k8s_helm_upgrade_result.rc | default(1) | int == 0
        fail_msg: >-
          Hubble UI Helm upgrade failed.
          rc={{ k8s_helm_upgrade_result.rc | default('unknown') }},
          stderr={{ k8s_helm_upgrade_result.stderr | default('', true) }}

    # --wait完了後もrelease自身がdeployed状態であることを共通post-conditionで確認する。
    - name: Wait for Cilium Helm release after Hubble UI update
      ansible.builtin.include_role:
        name: k8s-helm-common
        tasks_from: wait-release.yml
