---

# valuesファイルの親ディレクトリをHelm代表実行ユーザへ所有させ,
# Helm template/upgradeから同じvaluesファイルを参照できるようにする。
- name: Create elastic-agent-k8s Helm values directory
  ansible.builtin.file:
    path: "{{ elastic_agent_k8s_runtime_values_file_path | dirname }}"
    state: directory
    owner: "{{ elastic_agent_k8s_runtime_operator_user }}"
    group: "{{ elastic_agent_k8s_runtime_operator_user }}"
    mode: "0755"
  become: true

# Elastic Agent for Kubernetes固有のFleet設定とresourcesをvaluesへ描画し,
# Helm共通処理へ製品固有設定を持ち込まないようにする。
- name: Render elastic-agent-k8s Helm values file
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ elastic_agent_k8s_runtime_values_file_path }}"
    owner: "{{ elastic_agent_k8s_runtime_operator_user }}"
    group: "{{ elastic_agent_k8s_runtime_operator_user }}"
    mode: "0644"
    backup: false
  become: true
