---

# service のポートが開くまで待ち, その後の HTTP 検査が失敗しないようにする。
- name: Wait for Metricbeat HTTP port
  ansible.builtin.wait_for:
    host: "{{ metricbeat_wait_host }}"
    port: "{{ metricbeat_http_port }}"
    state: started
    timeout: "{{ metricbeat_wait_timeout }}"
    delay: "{{ metricbeat_wait_delay }}"
    sleep: "{{ metricbeat_wait_sleep }}"
  delegate_to: "{{ metricbeat_wait_delegate_to }}"
  register: metricbeat_wait_result
  until: metricbeat_wait_result is succeeded
  retries: "{{ metricbeat_wait_retries }}"
  delay: "{{ metricbeat_wait_sleep }}"

# Metricbeat の HTTP 応答を確認し, collector として応答可能であることを検証する。
- name: Verify Metricbeat response
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ metricbeat_http_port }}/"
    method: GET
    return_content: true
    status_code:
      - 200
  register: metricbeat_status_result
  until:
    - metricbeat_status_result is succeeded
    - metricbeat_status_result.status is defined
    - metricbeat_status_result.status == 200
  # モジュール初期化や出力先接続確立に時間を要する場合があるため,
  # 応答確認の試行回数は timeout と sleep から導出する。
  retries: "{{ ((metricbeat_wait_timeout | int) // ([metricbeat_wait_sleep | int, 1] | max)) + 1 }}"
  delay: "{{ metricbeat_wait_sleep }}"
  failed_when:
    - metricbeat_status_result.status != 200
