#
#  netshoot Helm導入・更新処理
#
---

# helm templateで検証した入力と同一のChart, Namespace, kubeconfigおよびvaluesを使用して
# 共通Helm処理からupgrade --installを実行する。
# k8s-helm-commonの入力変数は外側blockで定義し,
# 呼出先ロールの変数名をnetshootロール自身の変数として扱わせない。
- name: Install or upgrade netshoot
  vars:
    k8s_helm_release_name: "{{ netshoot_runtime_release_name }}"
    k8s_helm_namespace: "{{ netshoot_runtime_namespace }}"
    k8s_helm_chart_ref: "{{ netshoot_runtime_chart_dir }}"
    k8s_helm_chart_version: ""
    k8s_helm_kubeconfig_path: "{{ netshoot_runtime_kubeconfig_path }}"
    k8s_helm_values_files:
      - "{{ netshoot_runtime_values_file_path }}"
    k8s_helm_create_namespace: true
    k8s_helm_wait: true
    k8s_helm_operation_timeout_seconds: >-
      {{ netshoot_runtime_helm_timeout_seconds }}
    k8s_helm_operation_retries: >-
      {{ netshoot_runtime_helm_retries }}
    k8s_helm_operation_retry_interval_seconds: >-
      {{ netshoot_runtime_helm_retry_interval_seconds }}
    k8s_helm_operation_request_interval_seconds: >-
      {{ netshoot_runtime_helm_request_interval_seconds }}
  block:
    # k8s-helm-commonのupgrade処理へ検証済みHelm入力値を引き渡す。
    - name: Install or upgrade netshoot with common Helm role
      ansible.builtin.include_role:
        name: k8s-helm-common
        tasks_from: upgrade.yml

# check modeでは共通upgradeが実行されないため,
# 通常実行時だけ共通Helm処理の終了コードを最終結果として検証する。
- name: Validate netshoot Helm upgrade result
  ansible.builtin.assert:
    that:
      - k8s_helm_upgrade_result.rc | default(1) | int == 0
    fail_msg: >-
      Helm upgrade failed for netshoot-no-portscan.
      stderr={{ k8s_helm_upgrade_result.stderr | default('', true) }}
  when: not ansible_check_mode
