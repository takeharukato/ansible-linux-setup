# kube-apiが使えるようになるのを待ち合わせる
- name: Wait for kube-api-server
  ansible.builtin.wait_for:
    host: "{{ k8s_api_wait_host }}"
    port: "{{ k8s_api_wait_port }}"
    state: started
    timeout: "{{ k8s_api_wait_timeout }}"
    delay: "{{ k8s_api_wait_delay }}"
    sleep: "{{ k8s_api_wait_sleep }}"
  delegate_to: "{{ k8s_api_wait_delegate_to }}"
  register: k8s_whereabouts_api_wait_result
  until: k8s_whereabouts_api_wait_result is succeeded
  retries: "{{ k8s_api_wait_retries | default(5) }}"
  delay: "{{ k8s_api_wait_sleep }}"

# Kubernetes API操作もHelmと同じ代表実行ユーザで実行するため,
# sudo -u経路でkubectlが利用可能であることを事前に確認する。
# kubectl version --client=trueは変更を伴わないため, チェックモードでも実行する。
- name: Validate kubectl command availability for Whereabouts operator
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_whereabouts_runtime_operator_user }}"
      - kubectl
      - version
      - --client=true
      - --request-timeout={{ k8s_whereabouts_runtime_helm_timeout_seconds | int }}s
      - --output=yaml
  register: k8s_whereabouts_kubectl_version_result
  changed_when: false
  check_mode: false
  become: true
  until: k8s_whereabouts_kubectl_version_result.rc | default(1) | int == 0
  retries: "{{ k8s_whereabouts_runtime_helm_retries | int }}"
  delay: "{{ k8s_whereabouts_runtime_helm_request_interval_seconds | int }}"

# WhereaboutsのHelm release操作をk8s-helm-commonへ委譲し,
# 本ロールではWhereabouts固有設定とNAD操作に責務を限定する。
- name: Install Whereabouts via Helm
  ansible.builtin.include_tasks: helm.yml

# NetworkAttachmentDefinition (NAD)設定ファイル生成
- name: Setup whereabouts NetworkAttachmentDefinition (NAD) file
  ansible.builtin.template:
    src: ipvlan-wb-nad.yml.j2
    dest: "{{ k8s_whereabouts_config_dir }}/ipvlan-wb-nad.yml"
    owner: "{{ k8s_whereabouts_runtime_operator_user }}"
    group: "{{ k8s_whereabouts_runtime_operator_gid }}"
    mode: '0644'
    backup: false
  when: k8s_whereabouts_runtime_nad_enabled | default(false) | bool

# 旧設定(default namespace)のNADが残っている場合は削除し,
# Helmと同じ代表実行ユーザとkubeconfigで期待状態(kube-system)へ設定する。
- name: Delete legacy whereabouts NetworkAttachmentDefinition (NAD) in default namespace
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_whereabouts_runtime_operator_user }}"
      - kubectl
      - --kubeconfig
      - "{{ k8s_whereabouts_runtime_kubeconfig_path }}"
      - --request-timeout={{ k8s_whereabouts_runtime_helm_timeout_seconds | int }}s
      - delete
      - network-attachment-definitions.k8s.cni.cncf.io
      - ipvlan-wb
      - --namespace
      - default
      - --ignore-not-found=true
  become: true
  register: k8s_whereabouts_legacy_nad_delete_result
  changed_when: >-
    'deleted' in (k8s_whereabouts_legacy_nad_delete_result.stdout | lower)
  when: k8s_whereabouts_runtime_nad_enabled | default(false) | bool

# NetworkAttachmentDefinition (NAD)もHelmと同じ代表実行ユーザとkubeconfigで適用する。
- name: Apply NetworkAttachmentDefinition (NAD)
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_whereabouts_runtime_operator_user }}"
      - kubectl
      - --kubeconfig
      - "{{ k8s_whereabouts_runtime_kubeconfig_path }}"
      - --request-timeout={{ k8s_whereabouts_runtime_helm_timeout_seconds | int }}s
      - apply
      - -f
      - "{{ k8s_whereabouts_config_dir }}/ipvlan-wb-nad.yml"
  become: true
  register: k8s_whereabouts_nad_apply_result
  changed_when: >-
    ' created' in (k8s_whereabouts_nad_apply_result.stdout | lower)
    or ' configured' in (k8s_whereabouts_nad_apply_result.stdout | lower)
  when: k8s_whereabouts_runtime_nad_enabled | default(false) | bool
