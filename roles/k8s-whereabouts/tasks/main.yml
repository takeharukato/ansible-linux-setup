#
#  タスクメイン部
#
#  include_tasksで他のタスクを読み込む
#

# 最初に変数設定を読み直す ( role単独で実行可能とするため )
- name: "Load Params"
  ansible.builtin.include_tasks: load-params.yml

# Whereabouts本体の導入と検証用NADの生成条件を分離するため, 実行時設定を先に解決する。
- name: "Resolve Runtime Vars"
  ansible.builtin.include_tasks: resolve-runtime-vars.yml
  when:
    - k8s_multus_enabled | default(false)
    - k8s_whereabouts_enabled | default(false)

# パッケージ導入関連処理
- name: "Package"
  ansible.builtin.include_tasks: package.yml
  when:
    - k8s_multus_enabled | default(false)
    - k8s_whereabouts_enabled | default(false)

# ファイル・ディレクトリ作成処理
- name: "Directory"
  ansible.builtin.include_tasks: directory.yml
  when:
    - k8s_multus_enabled | default(false)
    - k8s_whereabouts_enabled | default(false)

# ユーザ・グループ作成処理
- name: "User Group"
  ansible.builtin.include_tasks: user_group.yml
  when:
    - k8s_multus_enabled | default(false)
    - k8s_whereabouts_enabled | default(false)

# サービス起動関連処理
- name: "Service"
  ansible.builtin.include_tasks: service.yml
  when:
    - k8s_multus_enabled | default(false)
    - k8s_whereabouts_enabled | default(false)

# Whereaboutsの導入処理
# Whereabouts本体のHelm導入はNAD設定の有無に依存させず,
# MultusとWhereaboutsが有効な場合に実行する。
- name: "Config Whereabouts"
  ansible.builtin.include_tasks: config-whereabouts.yml
  when:
    - k8s_multus_enabled | default(false) | bool
    - k8s_whereabouts_enabled | default(false) | bool

# 導入後の状態を検証し,WhereaboutsのDaemonSet,Podが正常であることを確認する。
# NAD設定が有効な場合だけNetworkAttachmentDefinitionも検証対象とする。
- name: "Verify"
  ansible.builtin.include_tasks: verify.yml
  when:
    - k8s_multus_enabled | default(false) | bool
    - k8s_whereabouts_enabled | default(false) | bool
