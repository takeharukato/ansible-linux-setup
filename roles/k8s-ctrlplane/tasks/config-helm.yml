#
#  Helmリポジトリ設定タスク
#

# 全repository削除は既存Helm設定を削除する互換操作であるため,
# 暗黙の型変換を許可せずboolean値だけを受け付ける。
- name: Validate Helm repository clear compatibility setting
  ansible.builtin.assert:
    that:
      - k8s_ctrlplane_helm_clear_repositories_enabled is boolean
    fail_msg: >-
      Invalid Helm repository clear compatibility setting.
      Set k8s_ctrlplane_helm_clear_repositories_enabled to a boolean value.

# Control Plane再構築時に既存Helm設定を引き継がない互換動作が
# 明示された場合だけ, Cilium repository登録前に全repositoryを削除する。
- name: Clear Helm repositories via k8s-helm-common
  vars:
    k8s_helm_repository_users: "{{ k8s_runtime_helm_execution_users }}"
    k8s_helm_operation_timeout_seconds: "{{ k8s_helm_timeout_seconds }}"
    k8s_helm_operation_retries: "{{ k8s_helm_retries }}"
    k8s_helm_operation_retry_interval_seconds: "{{ k8s_helm_retry_interval_seconds }}"
    k8s_helm_operation_request_interval_seconds: "{{ k8s_helm_request_interval_seconds }}"
  when: k8s_ctrlplane_helm_clear_repositories_enabled
  block:
    # 全repository削除処理はk8s-helm-commonへ委譲し,
    # k8s-ctrlplane内で同じ削除処理を重複実装しない。
    - name: Clear Helm repositories with common role
      ansible.builtin.include_role:
        name: k8s-helm-common
        tasks_from: clear-repositories.yml

# Cilium releaseは共通Helm代表ユーザで操作するため,
# 同じ実行ユーザ一覧のHelm設定へCilium repositoryを登録する。
# 全削除を実行しない場合は他componentのrepositoryを保持し,
# 対象repositoryだけを指定URLへ設定する。
- name: Configure Cilium Helm repository via k8s-helm-common
  vars:
    k8s_helm_repository_name: "cilium"
    k8s_helm_repository_url: "{{ k8s_cilium_helm_repo_url }}"
    k8s_helm_repository_users: "{{ k8s_runtime_helm_execution_users }}"
    k8s_helm_operation_timeout_seconds: "{{ k8s_helm_timeout_seconds }}"
    k8s_helm_operation_retries: "{{ k8s_helm_retries }}"
    k8s_helm_operation_retry_interval_seconds: "{{ k8s_helm_retry_interval_seconds }}"
    k8s_helm_operation_request_interval_seconds: "{{ k8s_helm_request_interval_seconds }}"
  block:
    # 共通ロール側で対象repositoryの現在状態を判定して必要な変更だけを実行する。
    - name: Reconcile Cilium Helm repository with common role
      ansible.builtin.include_role:
        name: k8s-helm-common
        tasks_from: repository.yml
