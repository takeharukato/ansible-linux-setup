#
#  APT自動更新復帰タスク
#
---

# 呼び出し先ロールの公開変数をblockスコープで渡し, apt-update-guardの変数名前空間へ
# apt-update-control固有の変数を直接定義せずに正常完了時の復旧処理を委譲する。
- name: "Deactivate APT update control"
  vars:
    apt_update_control_state: "inactive"
  block:
    # site.ymlが最終playまで正常完了した場合だけ共通ロールへ復旧を委譲し,
    # persistent maskを解除してディストリビューション既定のAPT timer運用へ戻す。
    - name: "Run APT update control deactivation"
      ansible.builtin.include_role:
        name: apt-update-control

# 同一Ansible実行中でも次のguardライフサイクル開始時には再起動できるように状態を初期化する。
- name: "Clear APT update guard runtime facts"
  ansible.builtin.set_fact:
    apt_update_guard_active: false
    apt_update_guard_reboot_done: false
