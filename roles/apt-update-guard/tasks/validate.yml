---

# active/inactive以外を早期に拒否し, APT自動更新制御が途中まで実行されることを防止する
# (apt_update_guard_state in ['active', 'inactive'])。
- name: "Validate APT update guard state"
  ansible.builtin.assert:
    that:
      - apt_update_guard_state in ['active', 'inactive']
    fail_msg: >-
      apt_update_guard_state must be either 'active' or 'inactive'.
      Current value: {{ apt_update_guard_state | default('', true) | string }}
    success_msg: "APT update guard state is valid"

# APTロック待機時間, 確認間隔, 1回のコマンド実行時間と再起動待機時間を正の値に限定し,
# 除算エラーや即時タイムアウトを防止する。
- name: "Validate APT update guard wait parameters"
  ansible.builtin.assert:
    that:
      - apt_update_guard_wait_timeout_seconds | int > 0
      - apt_update_guard_wait_interval_seconds | int > 0
      - apt_update_guard_command_timeout_seconds | int > 0
      - apt_update_guard_reboot_timeout_seconds | int > 0
    fail_msg: "APT update guard timeout and interval values must be greater than zero"
    success_msg: "APT update guard timeout and interval values are valid"

# fuserによる解放確認対象が空の場合にguard確立済みと誤判定しないようにする。
- name: "Validate APT update guard lock file list"
  ansible.builtin.assert:
    that:
      # ロック一覧として未定義又は空値が渡された場合も空リストとして評価する
      # (apt_update_guard_lock_files | default([], true) | length > 0)。
      - apt_update_guard_lock_files | default([], true) | length > 0
    fail_msg: "APT update guard lock file list must not be empty"
    success_msg: "APT update guard lock file list is valid"
