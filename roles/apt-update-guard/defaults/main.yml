#  ロール固有変数のデフォルト値
#  group_vars/all/all.yml やhost_varsで上書き可能とするため,
#  ロール名/defaults/main.yml に定義している
#
---

# 呼び出し元でactive/inactiveを明示し, 意図しないAPT自動更新制御を防止する。
apt_update_guard_state: ""

# unattended-upgrades終了待ちとAPTロック解放待ちの最大時間を秒単位で指定する。
apt_update_guard_wait_timeout_seconds: 1800

# unattended-upgrades終了待ちとAPTロック解放待ちの確認間隔を秒単位で指定する。
apt_update_guard_wait_interval_seconds: 5

# pgrep/fuserが異常停止した場合に待機処理全体が停止しないように1回の実行時間を制限する。
apt_update_guard_command_timeout_seconds: 10

# APT自動更新の再取得を防止するために停止するsystemd unitを指定する。
apt_update_guard_units_to_stop:
  - apt-daily.service
  - apt-daily-upgrade.service
  - apt-daily.timer
  - apt-daily-upgrade.timer

# 通常運用へ戻す際に再度有効化するsystemd timerを指定する。
apt_update_guard_timers_to_restore:
  - apt-daily.timer
  - apt-daily-upgrade.timer

# APTロック解放確認対象のファイルを指定する。
apt_update_guard_lock_files:
  - "/var/lib/dpkg/lock-frontend"
  - "/var/lib/dpkg/lock"
  - "/var/cache/apt/archives/lock"
  - "/var/lib/apt/lists/lock"

# 利用者独自のsystemd drop-inを変更しないように本ロール専用ファイル名を使用する。
apt_update_guard_persistent_dropin_name: "90-ansible-apt-update-guard.conf"

# APT自動更新停止後の再起動完了待ち時間を秒単位で指定する。
# common側の値が未定義または空の場合だけ600秒を使用する
# (reboot_timeout_sec | default(600, true))。
apt_update_guard_reboot_timeout_seconds: "{{ reboot_timeout_sec | default(600, true) }}"
