#
#  ネットワーク設定変更後の graceful reboot 処理
#
---

# ネットワーク設定変更後に graceful reboot を実行し、
# iptables-persistent が保存された設定を復元させる
- name: Reboot host gracefully after network configuration changes
  ansible.builtin.include_role:
    name: reboot-common
  vars:
    reboot_common_timeout: "{{ reboot_timeout_sec }}"
    reboot_common_message: "Reboot triggered by router-config role to apply iptables-persistent rules"
    reboot_common_pre_reboot_delay: 2
    reboot_common_become: true
