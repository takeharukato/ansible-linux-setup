#
# Debian系でのフロントエンドロック獲得失敗により
# apt updateが失敗しないようにするためのタスク
#

# unattended-upgradeサービスを停止し, apt操作に失敗しないようにする
# playbook実行中にunattended-upgradeサービスが, /var/lib/dpkg/lock-frontendを
# 使用することで, apt 操作が失敗することがあるため, playbook実行中は
# サービスを停止する
- name: "Stop unattended-upgrades service"
  ansible.builtin.service:
    name: unattended-upgrades
    state: stopped
    enabled: false
  become: true

# apt-daily 系タイマー/サービスを停止し, unattended-upgrades の再起動を抑止する
- name: "Stop apt daily units to prevent lock reacquisition"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ apt_daily_units_to_stop }}"
  become: true
  failed_when: false

# unattended-upgrades の実行プロセスが完全終了するまで待機する
- name: "Wait until unattended-upgrades process exits"
  ansible.builtin.command:
    cmd: "pgrep -x unattended-upgr"
  register: unattended_upgr_process_check
  changed_when: false
  failed_when: false
  until: unattended_upgr_process_check.rc != 0
  retries: "{{ (apt_lock_wait_timeout / apt_lock_check_interval) | int }}"
  delay: "{{ apt_lock_check_interval }}"
  become: true

# unattended-upgrades を止めた後, 1回だけ再起動して lock 保持を解消する
- name: "Reboot once after stopping unattended-upgrades"
  ansible.builtin.include_role:
    name: reboot-common
  vars:
    reboot_common_timeout: "{{ reboot_timeout_sec }}"
    reboot_common_message: "Reboot triggered after stopping unattended-upgrades to release apt locks"
    reboot_common_pre_reboot_delay: 2
  when: not (common_frontend_lock_reboot_done | default(false))

# ロック解除後に再起動済みであることを記録する
- name: "Mark frontend lock reboot as done"
  ansible.builtin.set_fact:
    common_frontend_lock_reboot_done: true

# ロックファイル監視処理のためにpsmiscパッケージをインストール
- name: "Ensure psmisc package is installed (provides fuser command)"
  ansible.builtin.package:
    name: psmisc
    state: present
  become: true

# playbook完了後にapt lock関連サービス/タイマーをデフォルト運用へ戻すため,
# notifyでapt_lock_defaults_restoredハンドラを呼び出す
- name: "Notify to restore apt lock related units to distro defaults"
  ansible.builtin.debug:
    msg: "Notify to restore apt lock related units to distro defaults"
  changed_when: true
  notify:
    - "apt_lock_defaults_restored"

# aptのロックファイルを監視し、ロックが解除されるまで待機する
- name: "Wait for apt lock files to be released"
  ansible.builtin.command:
    cmd: "fuser {{ item }}"
  register: apt_lock_check
  changed_when: false
  failed_when: false
  until: apt_lock_check.rc == 1
  retries: "{{ (apt_lock_wait_timeout / apt_lock_check_interval) | int }}"
  delay: "{{ apt_lock_check_interval }}"
  loop: "{{ apt_lock_files }}"
  become: true
