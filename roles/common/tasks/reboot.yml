#  リブートタスク

# 再起動要求があることを確認する
- name: Stat /var/run/reboot-required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

#
# 設定を更新したらリブート
#

- name: Disable GUI and reboot
  when:
    - reboot_required.stat.exists
  block:
    # GUIを無効化する
    - name: Disable_gui
      ansible.builtin.shell: |
        systemctl set-default multi-user.target
      become: true
      register: _result
      changed_when: _result.rc == 0

    # reboot-commonの公開変数をblockスコープで渡し, 呼出先ロールの変数名を維持する。
    - name: Reboot host gracefully
      vars:
        reboot_common_timeout: "{{ reboot_timeout_sec }}"
        reboot_common_message: "Reboot triggered by role: common"
        reboot_common_pre_reboot_delay: 2
      block:
        # 共通の再起動処理へ委譲し, commonロール内へ再起動実装を重複させない。
        - name: Run reboot-common role
          ansible.builtin.include_role:
            name: reboot-common
