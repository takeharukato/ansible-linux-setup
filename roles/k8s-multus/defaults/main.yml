#  -*- coding:utf-8 mode:yaml -*-
#  Ansible playbook
#  Copyright 2020 Takeharu KATO All Rights Reserved.
#  ロール固有変数のデフォルト値
#  group_vars/all/all.yml やhost_varsで上書き可能とするため,
#  ロール名/defaults/main.yml に定義している
---


# Multusディレクトリパス
k8s_multus_config_dir: "{{ k8s_kubeadm_config_store }}/multus"

# Multus CNIを有効化する
k8s_multus_enabled: false
# Multus CNIのバージョン(v4.2.3など上流イメージのタグを指定)
k8s_multus_version: "v4.2.3"
# Multus Helm Chartのバージョン
# 現在のロール内local ChartではHelmの--versionを使用しない。
# 将来repository又はOCI Chartへ切り替える場合にChart版数を指定する。
k8s_multus_helm_chart_version: ""
# Multus Helm Chartのソースパス (Ansible コントロールノード側のローカル Chart)
k8s_multus_helm_chart_source: "{{ role_path }}/files/multus-chart"
# Multusコンテナイメージのリポジトリ
k8s_multus_image_repository: "ghcr.io/k8snetworkplumbingwg/multus-cni"
# Multusコンテナイメージのバージョン
k8s_multus_image_version: "{{ k8s_multus_version }}"
# Multus CNI バイナリディレクトリ
k8s_multus_cni_bin_dir: "/opt/cni/bin"
# Multus CNI 設定ディレクトリ
k8s_multus_cni_conf_dir: "/etc/cni/net.d"
# Multus インストールタイプ (thin or thick)
k8s_multus_install_type: "thin"
# Helm再導入前に既存のMultusリソースを削除するか
k8s_multus_cleanup_resources: true
# Multusデーモンセット適用マニュフェストのURL (kubectl apply 用)
k8s_multus_daemonset_manifest_url: "https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/refs/tags/{{ k8s_multus_version }}/deployments/multus-daemonset.yml"
# multusをkubectl applyで導入する場合はtrueに設定
k8s_multus_kubectl_apply_enabled: false


# multus管理ツールシェル補完設定
k8s_collect_pod_ips_completion_enabled: true

# Pod アドレス収集ツール配置先
k8s_collect_pod_ips_script_path: "{{ k8s_node_setup_tools_dir }}/collect-pod-ips.py"
# bash 補完スクリプト配置先
k8s_collect_pod_ips_bash_completion_path: "/etc/bash_completion.d/collect-pod-ips"
# zsh 補完スクリプト配置先
k8s_collect_pod_ips_zsh_completion_path_debian: "/usr/share/zsh/vendor-completions/_collect-pod-ips"
k8s_collect_pod_ips_zsh_completion_path_rhel: "/usr/share/zsh/site-functions/_collect-pod-ips"
k8s_collect_pod_ips_zsh_completion_path: "{{ (ansible_facts.os_family == 'Debian') | ternary(k8s_collect_pod_ips_zsh_completion_path_debian, k8s_collect_pod_ips_zsh_completion_path_rhel) }}"
