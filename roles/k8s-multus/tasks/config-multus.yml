# kube-apiが使えるようになるのを待ち合わせる
- name: Wait for kube-api-server
  ansible.builtin.wait_for:
    host: "{{ k8s_api_wait_host }}"
    port: "{{ k8s_api_wait_port }}"
    state: started
    timeout: "{{ k8s_api_wait_timeout }}"
    delay: "{{ k8s_api_wait_delay }}"
    sleep: "{{ k8s_api_wait_sleep }}"
  delegate_to: "{{ k8s_api_wait_delegate_to }}"
  register: k8s_multus_helm_api_wait_result
  until: k8s_multus_helm_api_wait_result is succeeded
  retries: "{{ k8s_api_wait_retries | default(5) }}"
  delay: "{{ k8s_api_wait_sleep }}"
- name: Copy Multus Helm Chart to remote host
  ansible.builtin.copy:
    src: "{{ k8s_multus_helm_chart_source }}/"
    dest: "{{ k8s_multus_runtime_helm_chart_path }}/"
    owner: root
    group: root
    mode: preserve
  become: true

# Multus Values ファイル生成
- name: Setup Multus Helm values file
  ansible.builtin.template:
    src: multus-values.yml.j2
    dest: "{{ k8s_multus_runtime_values_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: false
