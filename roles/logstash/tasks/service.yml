---

# backend 専用ネットワークを作成し, Elasticsearch と Kibana と接続できるようにする。
- name: Check logstash backend network
  ansible.builtin.command:
    cmd: "docker network inspect {{ logstash_network_name }}"
  register: logstash_network_inspect
  failed_when: false
  changed_when: false

- name: Create logstash backend network
  ansible.builtin.command:
    cmd: "docker network create {{ logstash_network_name }}"
  when:
    - logstash_network_inspect.rc != 0
  changed_when: true

# 既存の同名コンテナが残っている場合に備え, 起動前に存在確認する。
- name: Check existing logstash container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - "{{ logstash_container_name }}"
  become: true
  register: logstash_container_inspect
  failed_when: false
  changed_when: false

# 既存の同名コンテナを削除して, compose 起動時の名前衝突と古い状態の残留を防止する。
- name: Remove existing logstash container before compose up
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - -f
      - "{{ logstash_container_name }}"
  become: true
  when:
    - logstash_container_inspect.rc == 0
  register: logstash_remove_existing_result
  changed_when: logstash_remove_existing_result.rc == 0

# compose 定義に基づいて Logstash を起動し, 設定変更を反映する。
- name: Start Logstash service container
  ansible.builtin.shell: |
    docker compose -f {{ logstash_compose_file }} up -d --remove-orphans
  args:
    chdir: "{{ logstash_compose_dir }}"
  become: true
  register: logstash_start_result
  changed_when: logstash_start_result.rc == 0
