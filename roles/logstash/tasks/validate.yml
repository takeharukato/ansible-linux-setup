# Logstash 実行に必要なパス, コンテナイメージ名, ポート, 対象 OS を検証する。
# 文字列入力の検証は, 未定義時に空文字へ置換(default('', true)) -> 文字列化(string) -> 前後空白除去(trim) -> 文字数判定(length) の順で実施する。
- name: Validate logstash runtime inputs
  ansible.builtin.assert:
    that:
      - (logstash_compose_dir | default('', true) | string | trim | length) > 0
      - (logstash_compose_file | default('', true) | string | trim | length) > 0
      - (logstash_image | default('', true) | string | trim | length) > 0
      - (logstash_network_name | default('', true) | string | trim | length) > 0
      - (logstash_beats_port | int) > 0
      - (logstash_beats_port | int) < 65536
      - (logstash_http_port | int) > 0
      - (logstash_http_port | int) < 65536
      - ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Invalid logstash settings. Ensure paths, image, ports, and OS family are
      configured correctly.
