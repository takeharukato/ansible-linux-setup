#
#  タスクメイン部
#
#  include_tasksで他のタスクを読み込む
#
---

# 最初に変数設定を読み直す ( role単独で実行可能とするため )
- name: "Load Params"
  ansible.builtin.include_tasks: load-params.yml

# Logstash の導入前提を確認し, 実行基盤の不足を早期に検出する。
- name: "Validate"
  ansible.builtin.include_tasks: validate.yml
  when:
    - logging_logstash_enabled | default(true) | bool

# docker compose の利用可否を確認し, コンテナ起動が可能であることを保証する。
- name: "Package"
  ansible.builtin.include_tasks: package.yml
  when:
    - logging_logstash_enabled | default(true) | bool

# compose 用ディレクトリと永続化領域を作成し, 設定配置先を整える。
- name: "Directory"
  ansible.builtin.include_tasks: directory.yml
  when:
    - logging_logstash_enabled | default(true) | bool

# 実行ユーザとグループを作成し, ディレクトリ所有権を整える。
- name: "User Group"
  ansible.builtin.include_tasks: user_group.yml
  when:
    - logging_logstash_enabled | default(true) | bool

# compose 定義と Logstash 設定ファイルを生成し, 起動設定を固定する。
- name: "Config"
  ansible.builtin.include_tasks: config.yml
  when:
    - logging_logstash_enabled | default(true) | bool

# 共有ネットワークを作成し, コンテナを起動して待受状態へ遷移させる。
- name: "Service"
  ansible.builtin.include_tasks: service.yml
  when:
    - logging_logstash_enabled | default(true) | bool

# 起動済みサービスの待受と応答を確認し, backend として利用可能であることを検証する。
- name: "Verify"
  ansible.builtin.include_tasks: verify.yml
  when:
    - logging_logstash_enabled | default(true) | bool
