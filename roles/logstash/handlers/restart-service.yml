#
#  Logstash再起動ハンドラ
#
---

# 設定変更時に compose を再適用し, Logstash コンテナを再作成する。
- name: Restart Logstash service
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ logstash_compose_file }}"
      - up
      - -d
      - --force-recreate
      - --remove-orphans
  args:
    chdir: "{{ logstash_compose_dir }}"
  become: true
  changed_when: true
  listen: logstash_restart_service
