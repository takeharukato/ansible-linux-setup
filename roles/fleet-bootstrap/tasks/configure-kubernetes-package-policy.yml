#
# Kubernetesクラスタ状態収集用Package Policy構築タスク
#
---

# Step7で定義するストリーム詳細を安全に導入できるように, 事前に補助フラグを解決する。
- name: Resolve Kubernetes cluster package policy runtime flags
  ansible.builtin.set_fact:
    fleet_bootstrap_k8s_cluster_package_policy_enabled: >-
      {{ logging_backend_elastic_agent_k8s_cluster_package_policy_enabled | default(true) | bool }}

# k8s_cluster構成種別専用のKubernetes統合Package Policyを共通CRUDタスクで管理する。
# inputsのキーはFleetが生成する入力識別子(<policy_template名>-<入力種別>)であること。
# state_* は kube-state-metrics, event は events の各policy_templateに属するため, 入力を分けて指定する。
- name: Configure Fleet Kubernetes cluster package policy
  ansible.builtin.include_tasks: configure-package-policy.yml
  vars:
    fleet_bootstrap_package_policy:
      name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-k8s-cluster"
      body:
        name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-k8s-cluster"
        description: Managed by Ansible
        namespace: "{{ logging_elastic_agent_k8s_cluster_data_stream_namespace | default('default') }}"
        policy_id: "{{ fleet_bootstrap_current_policy_id }}"
        package:
          name: kubernetes
          version: "{{ fleet_bootstrap_kubernetes_package_version }}"
        inputs:
          kube-state-metrics-kubernetes/metrics:
            enabled: true
            streams:
              kubernetes.state_deployment:
                enabled: "{{ fleet_bootstrap_k8s_state_deployment_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_statefulset:
                enabled: "{{ fleet_bootstrap_k8s_state_statefulset_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_pod:
                enabled: "{{ fleet_bootstrap_k8s_state_pod_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_node:
                enabled: "{{ fleet_bootstrap_k8s_state_node_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_namespace:
                enabled: "{{ fleet_bootstrap_k8s_state_namespace_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_daemonset:
                enabled: "{{ fleet_bootstrap_k8s_state_daemonset_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_replicaset:
                enabled: "{{ fleet_bootstrap_k8s_state_replicaset_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_job:
                enabled: "{{ fleet_bootstrap_k8s_state_job_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_storageclass:
                enabled: "{{ fleet_bootstrap_k8s_state_storageclass_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_persistentvolume:
                enabled: "{{ fleet_bootstrap_k8s_state_persistentvolume_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_persistentvolumeclaim:
                enabled: "{{ fleet_bootstrap_k8s_state_persistentvolumeclaim_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_resourcequota:
                enabled: "{{ fleet_bootstrap_k8s_state_resourcequota_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_service:
                enabled: "{{ fleet_bootstrap_k8s_state_service_enabled | default(false) | bool }}"
                vars:
                  period: "{{ logging_elastic_agent_k8s_cluster_metrics_period | default('10s') }}"
              kubernetes.state_cronjob:
                enabled: "{{ fleet_bootstrap_k8s_state_cronjob | default(false) | bool }}"
          events-kubernetes/metrics:
            enabled: true
            streams:
              kubernetes.event:
                enabled: "{{ fleet_bootstrap_k8s_event_enabled | default(false) | bool }}"
          # 未指定の入力はFleetが有効として扱うため, 収集対象外のpolicy_templateを明示的に無効化する。
          # kubelet系はノード側Elastic Agentの収集対象と重複し, container-logsはCustom Logs統合と重複するためです。
          kubelet-kubernetes/metrics:
            enabled: false
          kube-apiserver-kubernetes/metrics:
            enabled: false
          kube-proxy-kubernetes/metrics:
            enabled: false
          kube-scheduler-kubernetes/metrics:
            enabled: false
          kube-controller-manager-kubernetes/metrics:
            enabled: false
          container-logs-filestream:
            enabled: false
          audit-logs-filestream:
            enabled: false
          audit-logs-aws-cloudwatch:
            enabled: false
          audit-logs-azure-eventhub:
            enabled: false
          audit-logs-gcp-pubsub:
            enabled: false
  when:
    - fleet_bootstrap_k8s_cluster_package_policy_enabled | bool
