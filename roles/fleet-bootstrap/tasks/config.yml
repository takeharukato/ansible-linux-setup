#
# Fleet Bootstrap の各種 API 呼び出しを順序立てて実行する。
#
---

# API呼び出し前の入力検証と診断出力をまとめて実施する。
- name: Prepare Kibana API connection
  ansible.builtin.include_tasks: prepare-kibana-api.yml

# Fleet初期化とFleet Server host前提設定を実施する。
- name: Initialize Fleet resources
  ansible.builtin.include_tasks: initialize-fleet.yml

# Outputの作成又は更新を実施し, 後続処理で利用するOutput IDを解決する。
- name: Resolve Fleet output id
  ansible.builtin.include_tasks: resolve-output-id.yml

# Package Policy作成前に必要な統合パッケージを順序どおり導入する。
- name: Install Fleet integrations
  ansible.builtin.include_tasks: install-fleet-integrations.yml

# Agent Policy, Package Policy, Enrollment Token一覧を再取得し, Fleet Server専用Policyを整備する。
- name: Refresh Fleet state
  ansible.builtin.include_tasks: refresh-fleet-state.yml

# 構成種別ごとのAgent PolicyとEnrollment Token管理処理を実行する。
- name: Configure Fleet managed agent profiles
  ansible.builtin.include_tasks: configure-fleet-managed-agent-profiles.yml
