#
# Fleet Bootstrap の各種 API 呼び出しを順序立てて実行する。
#
---

# Kibana の Fleet API へ接続する前提条件として, API キーが設定されていることを確認する。
- name: Check Fleet Bootstrap API key is configured
  ansible.builtin.assert:
    that:
      - fleet_bootstrap_runtime_api_key | default('', true) | trim | length > 0
    fail_msg: "fleet_bootstrap_kibana_api_key must be configured in host_vars, shared facts, or environment variables"

# Fleet APIの許容範囲外で一覧取得が失敗する前に, Enrollment Token一覧取得件数の誤設定を検出する。
- name: Validate Fleet enrollment token list page size
  ansible.builtin.assert:
    that:
      - (fleet_bootstrap_enrollment_token_list_page_size | int) >= 1
      - (fleet_bootstrap_enrollment_token_list_page_size | int) <= 10000
    fail_msg: >-
      fleet_bootstrap_enrollment_token_list_page_size must be between 1 and 10000.

# 認証切り分けが必要な場合だけ, 機密値を伏せたまま API キー形式と接続先を可視化する。
# 正規表現'^[A-Za-z0-9+/=]+$'は, '^'と'$'が文字列全体, 文字クラスがBase64で使用する英数字,
# '+', '/', '='を表し, 'YWJjZA=='のような文字列に一致する。診断値には一致結果だけを出力する。
- name: Debug Fleet Bootstrap API key shape
  ansible.builtin.debug:
    msg:
      endpoint: "{{ fleet_bootstrap_kibana_url }}"
      key_length: "{{ fleet_bootstrap_runtime_api_key | default('', true) | trim | length }}"
      contains_colon: "{{ ':' in (fleet_bootstrap_runtime_api_key | default('', true) | trim) }}"
      contains_dot: "{{ '.' in (fleet_bootstrap_runtime_api_key | default('', true) | trim) }}"
      looks_base64_like: "{{ (fleet_bootstrap_runtime_api_key | default('', true) | trim) is regex('^[A-Za-z0-9+/=]+$') }}"
  when:
    - fleet_bootstrap_debug_auth_diagnostics | bool

# Fleet の初期化手順を実行して, 以降の Output, Agent Policy, Enrollment Token作成に必要な前提を設定する。
- name: Initialize Fleet setup
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/setup"
    method: POST
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    status_code:
      - 200
      - 201
      - 202
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_setup_result
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_setup_result.status | default(0) | int in [200, 201, 202]
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# Fleet Outputの作成対象を確認するための初期値を設定する。
- name: Initialize Fleet Bootstrap API state facts
  ansible.builtin.set_fact:
    fleet_bootstrap_output_exists: false

# Agent Policy 作成前に, Kibana 側の既定 Fleet Server host 設定を確保する。
- name: List existing Fleet Server hosts
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/fleet_server_hosts"
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_fleet_server_host_list
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_fleet_server_host_list.status | default(0) | int in [200]
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

- name: Create default Fleet Server host if missing
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/fleet_server_hosts"
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      name: "{{ fleet_bootstrap_fleet_server_host_name }}"
      host_urls: "{{ fleet_bootstrap_fleet_server_runtime_host_urls }}"
      is_default: true
    status_code:
      - 200
      - 201
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_fleet_server_host_result
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_fleet_server_host_result.status | default(0) | int in [200, 201]
  no_log: "{{ fleet_bootstrap_no_log | bool }}"
  # 既定 Fleet Server host が未作成であることを判定してから作成する。
  when:
    - (
        fleet_bootstrap_fleet_server_host_list.json['items'] | default([])
        | selectattr('is_default', 'equalto', true)
        | list
        | length
      ) == 0

# 既存の Fleet Output 一覧を取得して, 指定名の Output がすでに存在するかを確認する。
- name: List existing Fleet outputs
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/outputs"
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_output_list
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_output_list.status | default(0) | int in [200]
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# 指定名の既存Outputを1件へ絞り込み, 作成又は更新の判定に使用する。
- name: Resolve existing Fleet output
  ansible.builtin.set_fact:
    fleet_bootstrap_existing_output: >-
      {{
        fleet_bootstrap_output_list.json['items'] | default([])
        | selectattr('name', 'equalto', fleet_bootstrap_output_name)
        | list
        | first
        | default({})
      }}

# 既存の Output 一覧から指定名の Output を検索し, 存在しない場合にだけ新規作成する。
- name: Create Fleet output if missing
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/outputs"
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      name: "{{ fleet_bootstrap_output_name }}"
      type: logstash
      hosts: "{{ fleet_bootstrap_logstash_hosts }}"
      is_default: true
      is_default_monitoring: true
    status_code:
      - 200
      - 201
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_output_result
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_output_result.status | default(0) | int in [200, 201]
  no_log: "{{ fleet_bootstrap_no_log | bool }}"
  when:
    - fleet_bootstrap_existing_output.id is not defined

# 既存Outputの種別又は送信先が期待値と異なる場合は, Fleet管理下のAgentへLogstash出力を反映する。
- name: Update existing Fleet output when configuration differs
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/outputs/{{ fleet_bootstrap_existing_output.id }}"
    method: PUT
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      name: "{{ fleet_bootstrap_output_name }}"
      type: logstash
      hosts: "{{ fleet_bootstrap_logstash_hosts }}"
      is_default: true
      is_default_monitoring: true
    status_code:
      - 200
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_output_update_result
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_output_update_result.status | default(0) | int == 200
  no_log: "{{ fleet_bootstrap_no_log | bool }}"
  when:
    - fleet_bootstrap_existing_output.id is defined
    - >-
      (fleet_bootstrap_existing_output.type | default('') != 'logstash') or
      (fleet_bootstrap_existing_output.hosts | default([], true) != fleet_bootstrap_logstash_hosts) or
      not (fleet_bootstrap_existing_output.is_default | default(false) | bool) or
      not (fleet_bootstrap_existing_output.is_default_monitoring | default(false) | bool)

# 既存の Output から指定名の ID を取り出して, 後続の Policy 作成処理で利用できるようにする。
- name: Set Fleet output id fact
  ansible.builtin.set_fact:
    fleet_bootstrap_output_id: >-
      {{ fleet_bootstrap_existing_output.id | default('') }}

# 新規作成した Output の ID を取り出して, 後続の Policy 作成処理で利用できるようにする。
- name: Set Fleet output id from created result
  ansible.builtin.set_fact:
    fleet_bootstrap_output_id: "{{ fleet_bootstrap_output_result.json['item'].id | default('') }}"
  # 作成結果の利用可否をfleet_bootstrap_output_resultの定義有無,
  # 応答結果(json)の有無と応答結果内に応答結果の要素(item)が存在することで判定する。
  when:
    - fleet_bootstrap_output_result is defined
    - fleet_bootstrap_output_result.json is defined
    - fleet_bootstrap_output_result.json['item'] is defined

# Package Policy作成前に, Kibana 8.17と互換性があるSystem統合を導入する。
- name: Install Fleet system integration package
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/epm/packages/system/{{
      fleet_bootstrap_system_package_version }}
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      force: true
    status_code:
      - 200
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_system_package_install_result
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_system_package_install_result.status | default(0) | int == 200
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# Kubernetesログ用Package Policy作成前に, Kibana 8.17と互換性があるCustom Logs統合を導入する。
- name: Install Fleet filestream integration package
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/epm/packages/filestream/{{
      fleet_bootstrap_filestream_package_version }}
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      force: true
    status_code:
      - 200
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_filestream_package_install_result
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_filestream_package_install_result.status | default(0) | int == 200
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# Fleet Serverが専用Agent Policyを適用できるように, 互換版のFleet Server統合を導入する。
- name: Install Fleet Server integration package
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/epm/packages/fleet_server/{{
      fleet_bootstrap_fleet_server_package_version }}
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      force: true
    status_code:
      - 200
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_fleet_server_package_install_result
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_fleet_server_package_install_result.status | default(0) | int == 200
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# 先行処理で作成したリソースを含む最新のAgent Policy一覧を取得する。
- name: Refresh Fleet agent policy list
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/agent_policies?perPage=10000"
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_policy_list
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_policy_list.status | default(0) | int == 200
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# Package Policyを名称で冪等管理するため, 現在の一覧を取得する。
- name: List existing Fleet package policies
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/package_policies?perPage=10000"
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_package_policy_list
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_package_policy_list.status | default(0) | int == 200
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# Fleet Serverの状態APIが専用統合を待ち続けないように, 専用Agent Policyと統合を管理する。
- name: Configure Fleet Server agent policy
  ansible.builtin.include_tasks: configure-fleet-server-policy.yml

# 先行処理で作成したEnrollment Tokenを含む最新のEnrollment Token一覧を取得する。
- name: Refresh Fleet enrollment token list
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/enrollment_api_keys?perPage={{
      fleet_bootstrap_enrollment_token_list_page_size | int }}
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_timeout_seconds | int }}"
  register: fleet_bootstrap_token_list
  retries: "{{ fleet_bootstrap_kibana_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_retry_delay_seconds | int }}"
  until: fleet_bootstrap_token_list.status | default(0) | int == 200
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# Elastic Agent ポリシーごとのEnrollment Token秘密値を保存する前に空の辞書を用意する。
- name: Initialize Fleet enrollment token map
  ansible.builtin.set_fact:
    fleet_bootstrap_enrollment_tokens: {}
  no_log: "{{ fleet_bootstrap_no_log | bool }}"

# ホスト種別に対応する3種類のAgent Policy, Package Policy及びEnrollment Tokenを管理する。
- name: Configure Fleet managed agent policy profiles
  ansible.builtin.include_tasks: configure-agent-policy.yml
  loop: "{{ fleet_bootstrap_agent_policy_profiles }}"
  loop_control:
    loop_var: fleet_bootstrap_agent_policy_profile
    label: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}"
