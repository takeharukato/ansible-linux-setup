#  Copyright 2020 Takeharu KATO All Rights Reserved.
#
#  Fleet Package Policy作成更新タスク
#
---

# configure-package-policy.ymlは複数のPackage Policyに対して繰り返し呼び出されるため,
# 前回の呼び出し結果を誤って再利用しないように処理状態を初期化する。
- name: Initialize Fleet package policy runtime facts
  ansible.builtin.set_fact:
    fleet_bootstrap_current_package_policy: {}
    fleet_bootstrap_conflicting_package_policy: {}
    fleet_bootstrap_package_policy_requires_update: false
  changed_when: false

# 同名のPackage Policyが複数存在する場合は,
# 更新対象を一意に決定できないため処理を停止する。
- name: Assert Fleet package policy name is unique
  ansible.builtin.assert:
    that:
      - >-
        (
          fleet_bootstrap_package_policy_list.json['items'] | default([])
          | selectattr('name', 'equalto', fleet_bootstrap_package_policy.name)
          | list
          | length
        ) <= 1
    fail_msg: >-
      Multiple Fleet package policies with the same name were found.
      package_policy={{ fleet_bootstrap_package_policy.name }}

# 同名のPackage Policyを再利用し, 重複作成を防止する。
- name: Resolve existing Fleet package policy
  ansible.builtin.set_fact:
    fleet_bootstrap_existing_package_policy: >-
      {{
        fleet_bootstrap_package_policy_list.json['items'] | default([])
        | selectattr('name', 'equalto', fleet_bootstrap_package_policy.name)
        | list
        | first
        | default({})
      }}

# 既存Package Policyが存在する場合は,
# 後続の整合性検証と更新処理で使用するPackage Policyとして設定する。
- name: Set current Fleet package policy from existing policy
  ansible.builtin.set_fact:
    fleet_bootstrap_current_package_policy: >-
      {{ fleet_bootstrap_existing_package_policy }}
    fleet_bootstrap_package_policy_requires_update: true
  changed_when: false
  when:
    - fleet_bootstrap_existing_package_policy.id is defined

# Package Policyが未作成の場合は対象Agent Policyへ収集設定を追加し,
# 存在確認後に別処理が同名Package Policyを作成した場合の409も競合として受け入れる。
- name: Create Fleet package policy if missing
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/package_policies"
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body: "{{ fleet_bootstrap_package_policy.body }}"
    status_code:
      - 200
      - 201
      - 400
      - 401
      - 403
      - 404
      - 409
      - 429
      - 500
      - 502
      - 503
      - 504
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_package_policy_create_result
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: >-
    fleet_bootstrap_package_policy_create_result.status
    | default(0)
    | int in [200, 201, 400, 401, 403, 404, 409]
  failed_when: >-
    fleet_bootstrap_package_policy_create_result.status
    | default(0)
    | int in [400, 401, 403, 404]
  when:
    - fleet_bootstrap_existing_package_policy.id is not defined

# Package Policy作成要求と別の実行が競合した場合は一覧を再取得し,
# 競合相手によって作成された同名Package Policyを解決できるようにする。
- name: Refresh Fleet package policy list after create conflict
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url
      }}/api/fleet/package_policies?perPage=10000
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    status_code:
      - 200
      - 400
      - 401
      - 403
      - 404
      - 429
      - 500
      - 502
      - 503
      - 504
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_package_policy_conflict_list
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: >-
    fleet_bootstrap_package_policy_conflict_list.status
    | default(0)
    | int in [200, 400, 401, 403, 404]
  failed_when: >-
    fleet_bootstrap_package_policy_conflict_list.status
    | default(0)
    | int != 200
  when:
    - fleet_bootstrap_package_policy_create_result.status | default(0) | int == 409

# 作成競合後に同名Package Policyが1件だけ存在することを確認し,
# 更新対象を一意に決定できない場合は処理を停止する。
- name: Assert Fleet package policy exists uniquely after create conflict
  ansible.builtin.assert:
    that:
      - >-
        (
          fleet_bootstrap_package_policy_conflict_list.json['items']
          | default([])
          | selectattr(
              'name',
              'equalto',
              fleet_bootstrap_package_policy.name
            )
          | list
          | length
        ) == 1
    fail_msg: >-
      Fleet package policy creation returned Conflict,
      but exactly one expected package policy was not found.
      package_policy={{ fleet_bootstrap_package_policy.name }}
  when:
    - fleet_bootstrap_package_policy_create_result.status | default(0) | int == 409

# 作成競合後に再取得した一覧から同名Package Policyを解決する。
- name: Resolve Fleet package policy after create conflict
  ansible.builtin.set_fact:
    fleet_bootstrap_conflicting_package_policy: >-
      {{
        fleet_bootstrap_package_policy_conflict_list.json['items']
        | default([])
        | selectattr(
            'name',
            'equalto',
            fleet_bootstrap_package_policy.name
          )
        | list
        | first
        | default({})
      }}
  changed_when: false
  when:
    - fleet_bootstrap_package_policy_create_result.status | default(0) | int == 409

# 作成競合後に取得したPackage Policyを,
# 後続の整合性検証と更新処理で使用するPackage Policyとして設定する。
- name: Set current Fleet package policy from conflicting policy
  ansible.builtin.set_fact:
    fleet_bootstrap_current_package_policy: >-
      {{ fleet_bootstrap_conflicting_package_policy }}
    fleet_bootstrap_package_policy_requires_update: true
  changed_when: false
  when:
    - fleet_bootstrap_package_policy_create_result.status | default(0) | int == 409
    - fleet_bootstrap_conflicting_package_policy.id is defined

# 既存又は作成競合後に取得したPackage Policyが,
# 同名であるだけでなく期待するIntegrationとAgent Policyに属することを確認する。
- name: Assert existing Fleet package policy identity
  ansible.builtin.assert:
    that:
      - fleet_bootstrap_current_package_policy.id is defined
      - fleet_bootstrap_current_package_policy.id | string | length > 0
      - >-
        fleet_bootstrap_current_package_policy.name | default('')
        == fleet_bootstrap_package_policy.name
      - >-
        fleet_bootstrap_current_package_policy.package.name | default('')
        == fleet_bootstrap_package_policy.body.package.name
      - >-
        fleet_bootstrap_current_package_policy.policy_id | default('')
        == fleet_bootstrap_package_policy.body.policy_id
    fail_msg: >-
      Existing Fleet package policy does not match the expected identity.
      package_policy={{ fleet_bootstrap_package_policy.name }}
      expected_package={{
        fleet_bootstrap_package_policy.body.package.name
      }}
      actual_package={{
        fleet_bootstrap_current_package_policy.package.name | default('')
      }}
      expected_policy_id={{
        fleet_bootstrap_package_policy.body.policy_id
      }}
      actual_policy_id={{
        fleet_bootstrap_current_package_policy.policy_id | default('')
      }}
  when:
    - fleet_bootstrap_package_policy_requires_update | bool

# Fleet APIの更新要求はinputs配列を要求するため,
# 作成要求用の辞書を更新用配列へ変換する。
- name: Normalize existing Fleet package policy update body
  ansible.builtin.include_tasks: normalize-package-policy-update.yml
  when:
    - fleet_bootstrap_package_policy_requires_update | bool

# 既存又は作成競合後に取得したPackage Policyへ現在の収集設定を反映し,
# Ansible設定を正とする。
- name: Update existing Fleet package policy
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/package_policies/{{
      fleet_bootstrap_current_package_policy.id }}
    method: PUT
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body: "{{ fleet_bootstrap_package_policy_update_body }}"
    status_code:
      - 200
      - 400
      - 401
      - 403
      - 404
      - 409
      - 429
      - 500
      - 502
      - 503
      - 504
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_package_policy_update_result
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: >-
    fleet_bootstrap_package_policy_update_result.status
    | default(0)
    | int in [200, 400, 401, 403, 404, 409]
  failed_when: >-
    fleet_bootstrap_package_policy_update_result.status
    | default(0)
    | int != 200
  when:
    - fleet_bootstrap_package_policy_requires_update | bool
