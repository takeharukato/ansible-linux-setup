#
#  Fleet Agent Policy作成タスク
#
---

# Agent Policyへ設定するElastic Agent自身の監視対象をプロファイルごとに解決する。
# 既存プロファイルでは従来どおりlogsとmetricsを有効化する。
# k8s_auditプロファイルでは利用者設定に従って監視対象を構成し,
# monitoring_enabledがfalseの場合は監視対象を空リストとする。
- name: Resolve Fleet agent policy monitoring settings
  ansible.builtin.set_fact:
    fleet_bootstrap_current_monitoring_enabled: >-
      {{
        (
          (
            ['logs']
            if (
              logging_backend_elastic_agent_k8s_audit_monitoring_enabled | bool
              and
              logging_backend_elastic_agent_k8s_audit_monitoring_logs_enabled | bool
            )
            else []
          )
          +
          (
            ['metrics']
            if (
              logging_backend_elastic_agent_k8s_audit_monitoring_enabled | bool
              and
              logging_backend_elastic_agent_k8s_audit_monitoring_metrics_enabled | bool
            )
            else []
          )
        )
        if (fleet_bootstrap_agent_policy_profile.id == 'k8s_audit')
        else ['logs', 'metrics']
      }}

# 同名のAgent Policyを再利用し, Elastic Agent ポリシーごとの登録先を一意にする。
- name: Resolve existing Fleet agent policy
  ansible.builtin.set_fact:
    fleet_bootstrap_existing_agent_policy: >-
      {{
        fleet_bootstrap_policy_list.json['items'] | default([])
        | selectattr('name', 'equalto', fleet_bootstrap_agent_policy_profile.policy_name)
        | list
        | first
        | default({})
      }}

# Agent Policyが未作成の場合は, 既定Logstash Outputを継承するAgent Policyを作成する。
- name: Create Fleet agent policy if missing
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/agent_policies"
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}"
      namespace: default
      description: Managed by Ansible
      monitoring_enabled: "{{ fleet_bootstrap_current_monitoring_enabled }}"
    status_code:
      - 200
      - 201
      - 409
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_agent_policy_create_result
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: fleet_bootstrap_agent_policy_create_result.status | default(0) | int in [200, 201, 409]
  when:
    - fleet_bootstrap_existing_agent_policy.id is not defined

# 作成要求と別の実行が競合した場合だけ一覧を再取得し, 作成済みの同名Policyを後続処理で再利用する。
- name: Refresh Fleet agent policy list after create conflict
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/agent_policies?perPage=10000"
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_agent_policy_conflict_list
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: fleet_bootstrap_agent_policy_conflict_list.status | default(0) | int == 200
  when:
    - fleet_bootstrap_agent_policy_create_result.status | default(0) | int == 409

# 競合後に同名Policyを取得できない場合は後続の統合設定先を特定できないため, 処理を停止する。
- name: Resolve Fleet agent policy created by concurrent execution
  ansible.builtin.set_fact:
    fleet_bootstrap_conflicting_agent_policy: >-
      {{
        fleet_bootstrap_agent_policy_conflict_list.json['items'] | default([])
        | selectattr('name', 'equalto', fleet_bootstrap_agent_policy_profile.policy_name)
        | list
        | first
        | default({})
      }}
  when:
    - fleet_bootstrap_agent_policy_create_result.status | default(0) | int == 409

# 作成競合を成功として扱うのは同名Policyの識別子を再取得できた場合だけに限定する。
- name: Assert Fleet agent policy exists after create conflict
  ansible.builtin.assert:
    that:
      - fleet_bootstrap_conflicting_agent_policy.id is defined
    fail_msg: >-
      Fleet agent policy creation returned Conflict, but the policy was not found.
      policy={{ fleet_bootstrap_agent_policy_profile.policy_name }}
  when:
    - fleet_bootstrap_agent_policy_create_result.status | default(0) | int == 409

# 初回検索結果又は競合後の再取得結果を統一し, 後続の出力設定更新とID解決に同じPolicyを使用する。
- name: Resolve effective Fleet agent policy
  ansible.builtin.set_fact:
    fleet_bootstrap_effective_agent_policy: >-
      {{
        fleet_bootstrap_existing_agent_policy
        if fleet_bootstrap_existing_agent_policy.id is defined
        else (
          fleet_bootstrap_conflicting_agent_policy | default({}, true)
          if (fleet_bootstrap_agent_policy_create_result.status | default(0) | int == 409)
          else {}
        )
      }}

# 個別出力割当を削除し, Basicライセンスでも既定Logstash Outputを継承できるようにする。
- name: Reset Fleet agent policy output to defaults
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/agent_policies/{{
      fleet_bootstrap_effective_agent_policy.id }}
    method: PUT
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}"
      namespace: default
      description: Managed by Ansible
      data_output_id: null
      monitoring_output_id: null
      monitoring_enabled: "{{ fleet_bootstrap_current_monitoring_enabled }}"
    status_code:
      - 200
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_agent_policy_update_result
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: fleet_bootstrap_agent_policy_update_result.status | default(0) | int == 200
  when:
    - fleet_bootstrap_effective_agent_policy.id is defined
    - >-
      (fleet_bootstrap_effective_agent_policy.data_output_id | default('', true) | string | length > 0) or
      (fleet_bootstrap_effective_agent_policy.monitoring_output_id | default('', true) | string | length > 0) or
      (
        (
          fleet_bootstrap_effective_agent_policy.monitoring_enabled
          | default([], true)
          | sort
          | list
        )
        !=
        (
          fleet_bootstrap_current_monitoring_enabled
          | sort
          | list
        )
      )

# 既存又は新規Agent PolicyのIDを後続のPackage PolicyとEnrollment Tokenへ渡す。
- name: Resolve Fleet agent policy id
  ansible.builtin.set_fact:
    fleet_bootstrap_current_policy_id: >-
      {{
        fleet_bootstrap_effective_agent_policy.id
        if fleet_bootstrap_effective_agent_policy.id is defined
        else fleet_bootstrap_agent_policy_create_result.json['item'].id
      }}

# 対象Agent Policyへ追加するSystem統合の収集内容を組み立てる。
- name: Configure Fleet system package policy
  ansible.builtin.include_tasks: configure-package-policy.yml
  vars:
    fleet_bootstrap_package_policy:
      name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-system"
      body:
        name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-system"
        description: Managed by Ansible
        namespace: default
        policy_id: "{{ fleet_bootstrap_current_policy_id }}"
        package:
          name: system
          version: "{{ fleet_bootstrap_system_package_version }}"
        inputs:
          system-logfile:
            enabled: false
            streams:
              system.auth:
                enabled: false
              system.syslog:
                enabled: false
          system-journald:
            enabled: false
            streams:
              system.auth:
                enabled: false
              system.syslog:
                enabled: false
          system-winlog:
            enabled: false
            streams:
              system.application:
                enabled: false
              system.security:
                enabled: false
              system.system:
                enabled: false
          system-system/metrics:
            enabled: "{{ logging_elastic_agent_host_metrics_input_enabled | default(true) | bool }}"
            streams:
              system.core:
                enabled: false
              system.cpu:
                enabled: true
                vars:
                  period: "{{ logging_elastic_agent_host_metrics_period | default('10s') }}"
              system.diskio:
                enabled: false
              system.memory:
                enabled: true
                vars:
                  period: "{{ logging_elastic_agent_host_metrics_period | default('10s') }}"
              system.filesystem:
                enabled: >-
                  {{
                    (fleet_bootstrap_agent_policy_profile.include_k8s_system | bool)
                    and (logging_elastic_agent_k8s_system_node_metrics_input_enabled | default(true) | bool)
                  }}
                vars:
                  period: "{{ logging_elastic_agent_k8s_system_metrics_period | default('10s') }}"
              system.process:
                enabled: >-
                  {{
                    (fleet_bootstrap_agent_policy_profile.include_k8s_system | bool)
                    and (logging_elastic_agent_k8s_system_kubelet_metrics_input_enabled | default(true) | bool)
                  }}
                vars:
                  period: "{{ logging_elastic_agent_k8s_system_metrics_period | default('10s') }}"
              system.fsstat:
                enabled: false
              system.load:
                enabled: false
              system.network:
                enabled: false
              system.process.summary:
                enabled: false
              system.socket_summary:
                enabled: false
              system.uptime:
                enabled: false
  # Kubernetesクラスタ全体の状態収集専用Policyではホスト情報を重複収集しないため,
  # System Integrationの設定対象を明示的に制御する。
  when:
    - fleet_bootstrap_agent_policy_profile.include_system | default(true) | bool

# 既存の任意パス指定を維持するため, ホストログをCustom Logs統合で収集する。
- name: Configure Fleet host log package policy
  ansible.builtin.include_tasks: configure-package-policy.yml
  vars:
    fleet_bootstrap_package_policy:
      name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-host-logs"
      body:
        name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-host-logs"
        description: Managed by Ansible
        namespace: "{{ logging_elastic_agent_host_data_stream_namespace | default('default') }}"
        policy_id: "{{ fleet_bootstrap_current_policy_id }}"
        package:
          name: filestream
          version: "{{ fleet_bootstrap_filestream_package_version }}"
        inputs:
          filestream-filestream:
            enabled: true
            streams:
              filestream.generic:
                enabled: true
                vars:
                  paths: "{{ logging_elastic_agent_host_log_paths | default(['/var/log/syslog', '/var/log/auth.log'], true) }}"
                  data_stream.dataset: generic
  when:
    - not (fleet_bootstrap_agent_policy_profile.include_k8s_audit | bool)
    - logging_elastic_agent_host_log_input_enabled | default(true) | bool

# Kubernetes制御系ログは名前空間を含むファイル名だけを収集し, Workloadログとの重複を防ぐ。
- name: Configure Fleet Kubernetes system log package policy
  ansible.builtin.include_tasks: configure-package-policy.yml
  vars:
    fleet_bootstrap_package_policy:
      name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-k8s-system-logs"
      body:
        name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-k8s-system-logs"
        description: Managed by Ansible
        namespace: "{{ logging_elastic_agent_k8s_system_data_stream_namespace | default('default') }}"
        policy_id: "{{ fleet_bootstrap_current_policy_id }}"
        package:
          name: filestream
          version: "{{ fleet_bootstrap_filestream_package_version }}"
        inputs:
          filestream-filestream:
            enabled: true
            streams:
              filestream.generic:
                enabled: true
                vars:
                  paths: "{{ logging_elastic_agent_k8s_system_kube_system_log_paths | default(['/var/log/containers/*_kube-system_*.log'], true) }}"
                  data_stream.dataset: kubernetes.container
                  parsers: |-
                    - container:
                        stream: all
                  processors: |-
                    - add_fields:
                        target: ''
                        fields:
                          k8s_namespace: "{{ logging_elastic_agent_k8s_system_kube_system_namespace | default('kube-system') }}"
  when:
    - fleet_bootstrap_agent_policy_profile.include_k8s_system | bool
    - logging_elastic_agent_k8s_system_kube_system_logs_input_enabled | default(true) | bool

# Workloadログからkube-systemファイルを除外し, 制御系ログの二重収集を防ぐ。
- name: Configure Fleet Kubernetes workload log package policy
  ansible.builtin.include_tasks: configure-package-policy.yml
  vars:
    fleet_bootstrap_package_policy:
      name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-k8s-workload-logs"
      body:
        name: "{{ fleet_bootstrap_agent_policy_profile.policy_name }}-k8s-workload-logs"
        description: Managed by Ansible
        namespace: "{{ logging_elastic_agent_k8s_workload_data_stream_namespace | default('default') }}"
        policy_id: "{{ fleet_bootstrap_current_policy_id }}"
        package:
          name: filestream
          version: "{{ fleet_bootstrap_filestream_package_version }}"
        inputs:
          filestream-filestream:
            enabled: true
            streams:
              filestream.generic:
                enabled: true
                vars:
                  paths: "{{ logging_elastic_agent_k8s_workload_log_paths | default(['/var/log/containers/*.log'], true) }}"
                  exclude_files:
                    - '_kube-system_'
                  data_stream.dataset: kubernetes.container
                  parsers: |-
                    - container:
                        stream: all
                  processors: |-
                    - add_fields:
                        target: ''
                        fields:
                          k8s_namespace_pattern: "{{ logging_elastic_agent_k8s_workload_log_namespace_pattern | default('.*') }}"
                          k8s_label_selector: "{{ logging_elastic_agent_k8s_workload_log_label_selector | default('') }}"
                          k8s_label_exclude_selector: "{{ logging_elastic_agent_k8s_workload_log_label_exclude_selector | default('') }}"
  when:
    - fleet_bootstrap_agent_policy_profile.include_k8s_workload | bool
    - logging_elastic_agent_k8s_workload_log_input_enabled | default(true) | bool

# Kubernetesクラスタ全体の状態収集は専用Package Policyへ分離し, 他の収集設定との依存を局所化する。
- name: Configure Fleet Kubernetes cluster package policy
  ansible.builtin.include_tasks: configure-kubernetes-package-policy.yml
  when:
    - fleet_bootstrap_agent_policy_profile.include_k8s_cluster | bool

# Kubernetes API監査ログ収集は専用Package Policyへ分離し,
# 他のKubernetes収集設定との重複を防止する。
- name: Configure Fleet Kubernetes audit package policy
  ansible.builtin.include_tasks: configure-kubernetes-audit-package-policy.yml
  when:
    - fleet_bootstrap_agent_policy_profile.include_k8s_audit | bool
    - logging_backend_elastic_agent_k8s_audit_package_policy_enabled | bool

# 対象Agent Policyに対応する既存Enrollment Tokenを検索する。
- name: Resolve existing Fleet enrollment token
  ansible.builtin.set_fact:
    fleet_bootstrap_existing_token_item: >-
      {{
        fleet_bootstrap_token_list.json['items'] | default([])
        | selectattr('policy_id', 'equalto', fleet_bootstrap_current_policy_id)
        | selectattr('name', 'defined')
        | selectattr(
            'name',
            'match',
            '^' ~ (fleet_bootstrap_agent_policy_profile.enrollment_token_name | regex_escape)
            ~ ' \([0-9a-fA-F-]{36}\)$'
          )
        | list
        | first
        | default({})
      }}

# Enrollment Tokenが未作成の場合は, 対象Agent Policyへの登録用Enrollment Tokenを作成する。
- name: Create Fleet enrollment token if missing
  ansible.builtin.uri:
    url: "{{ fleet_bootstrap_kibana_url }}/api/fleet/enrollment_api_keys"
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      name: "{{ fleet_bootstrap_agent_policy_profile.enrollment_token_name }}"
      policy_id: "{{ fleet_bootstrap_current_policy_id }}"
    status_code:
      - 200
      - 201
      - 409
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_enrollment_token_create_result
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: fleet_bootstrap_enrollment_token_create_result.status | default(0) | int in [200, 201, 409]
  when:
    - fleet_bootstrap_existing_token_item.id is not defined

# 作成要求と別の実行が競合した場合だけ一覧を再取得し, 同じPolicyと名前を持つEnrollment Tokenを再利用する。
- name: Refresh Fleet enrollment token list after create conflict
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/enrollment_api_keys?perPage={{
      fleet_bootstrap_enrollment_token_list_page_size | int }}
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_enrollment_token_conflict_list
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: fleet_bootstrap_enrollment_token_conflict_list.status | default(0) | int == 200
  when:
    - fleet_bootstrap_enrollment_token_create_result.status | default(0) | int == 409

# 競合後の一覧から対象Policyと登録名が一致するTokenを選択し, 秘密値取得の対象を一意にする。
- name: Resolve Fleet enrollment token created by concurrent execution
  ansible.builtin.set_fact:
    fleet_bootstrap_conflicting_token_item: >-
      {{
        fleet_bootstrap_enrollment_token_conflict_list.json['items'] | default([])
        | selectattr('policy_id', 'equalto', fleet_bootstrap_current_policy_id)
        | selectattr('name', 'equalto', fleet_bootstrap_agent_policy_profile.enrollment_token_name)
        | list
        | first
        | default({})
      }}
  when:
    - fleet_bootstrap_enrollment_token_create_result.status | default(0) | int == 409

# 作成競合を成功として扱うのは既存Tokenの識別子を再取得できた場合だけに限定する。
- name: Assert Fleet enrollment token exists after create conflict
  ansible.builtin.assert:
    that:
      - fleet_bootstrap_conflicting_token_item.id is defined
    fail_msg: >-
      Fleet enrollment token creation returned Conflict, but the token was not found.
      policy={{ fleet_bootstrap_current_policy_id }}
      token={{ fleet_bootstrap_agent_policy_profile.enrollment_token_name }}
  when:
    - fleet_bootstrap_enrollment_token_create_result.status | default(0) | int == 409

# 初回検索結果又は競合後の再取得結果を統一し, 秘密値取得と共有辞書への保存に同じTokenを使用する。
- name: Resolve effective Fleet enrollment token
  ansible.builtin.set_fact:
    fleet_bootstrap_effective_token_item: >-
      {{
        fleet_bootstrap_existing_token_item
        if fleet_bootstrap_existing_token_item.id is defined
        else (
          fleet_bootstrap_conflicting_token_item | default({}, true)
          if (fleet_bootstrap_enrollment_token_create_result.status | default(0) | int == 409)
          else {}
        )
      }}

# 一覧APIが秘密値を返さないため, 既存又は競合後に再取得したEnrollment Tokenだけ個別取得する。
- name: Get existing Fleet enrollment token
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/enrollment_api_keys/{{
      fleet_bootstrap_effective_token_item.id }}
    method: GET
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_enrollment_token_get_result
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: fleet_bootstrap_enrollment_token_get_result.status | default(0) | int == 200
  when:
    - fleet_bootstrap_effective_token_item.id is defined

# 5種類のAgent Policyに対応するEnrollment TokenをEnrollment Token共有ファイルへ保存できる辞書へ集約する。
- name: Store Fleet enrollment token by profile
  ansible.builtin.set_fact:
    fleet_bootstrap_enrollment_tokens: >-
      {{
        fleet_bootstrap_enrollment_tokens
        | combine(
            {
              fleet_bootstrap_agent_policy_profile.id:
                (
                  fleet_bootstrap_enrollment_token_get_result.json['item'].api_key
                  if fleet_bootstrap_effective_token_item.id is defined
                  else fleet_bootstrap_enrollment_token_create_result.json['item'].api_key
                )
            }
          )
      }}
