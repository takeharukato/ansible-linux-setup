#
# Fleet Kubernetes統合パッケージ導入タスク
#
---

# k8s_cluster又はk8s_audit構成種別を利用する場合に
# Kubernetes統合を導入し, 不要な導入を回避する。
- name: Install Fleet kubernetes integration package
  ansible.builtin.uri:
    url: >-
      {{ fleet_bootstrap_kibana_url }}/api/fleet/epm/packages/kubernetes/{{
      fleet_bootstrap_kubernetes_package_version }}
    method: POST
    body_format: json
    headers:
      Authorization: "ApiKey {{ fleet_bootstrap_runtime_api_key }}"
      kbn-xsrf: "{{ fleet_bootstrap_kibana_xsrf_token }}"
      Content-Type: application/json
    body:
      force: true
    status_code:
      - 200
      - 400
      - 401
      - 403
      - 404
      - 429
      - 500
      - 502
      - 503
      - 504
    return_content: true
    validate_certs: "{{ fleet_bootstrap_kibana_validate_certs | bool }}"
    timeout: "{{ fleet_bootstrap_kibana_api_request_timeout_seconds | int }}"
  register: fleet_bootstrap_kubernetes_package_install_result
  retries: "{{ fleet_bootstrap_kibana_api_retries | int }}"
  delay: "{{ fleet_bootstrap_kibana_api_retry_interval_seconds | int }}"
  until: >-
    fleet_bootstrap_kubernetes_package_install_result.status
    | default(0)
    | int in [200, 400, 401, 403, 404]
  failed_when: >-
    fleet_bootstrap_kubernetes_package_install_result.status
    | default(0)
    | int != 200
  when:
    - >-
      (
        (
          fleet_bootstrap_agent_policy_profiles | default([], true)
          | selectattr('include_k8s_cluster', 'equalto', true)
          | list
          | length
        ) > 0
      )
      or
      (
        (
          fleet_bootstrap_agent_policy_profiles | default([], true)
          | selectattr('include_k8s_audit', 'equalto', true)
          | list
          | length
        ) > 0
      )
