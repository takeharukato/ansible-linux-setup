# Fleet Bootstrap の実行有効化フラグ
# 留意事項: Elasticsearch の Security 機能を有効化した場合は,
#  fleet_bootstrap_enabled の設定値に関係なく Fleet Bootstrap を実行する。
#  そのため, 本 playbook の既定動作に合わせて既定値を true に設定している。
fleet_bootstrap_enabled: true

#
# Fleet Bootstrap に必要な Kibana API 接続設定と初期化対象の名称を既定値として定義する。
#
# Kibana の Fleet API へ接続するためのベース URL 明示指定値
# vars/all-config.ymlでlogging_backend_host変数を用いて指定することが推奨される
# 運用であるため, ここでは空文字列を既定値として定義する。
fleet_bootstrap_kibana_url_explicit: ""
# Fleet Bootstrap から Kibana API へ接続する際の TLS 検証モード。
# 利用可能値: off, none, full
fleet_bootstrap_kibana_tls_mode: "{{ logging_backend_default_tls_mode | default('none') }}"
# Fleet API へ認証するための API キー
# 本ロールで Fleet API へ接続する際に使用する API キーを指定する。
# vars/all-config.ymlで指定する変数であるため, ここでは空文字列を既定値として定義する。
fleet_bootstrap_kibana_api_key: ""
# Kibana API へ送信する際の XSRF トークン値
fleet_bootstrap_kibana_xsrf_token: "1"

#
# API接続リトライ関連設定
#
# Kibana API は起動直後や統合導入直後に一時的な接続失敗が発生し得るため,
# 1回の要求時間を短く保ち, 短い間隔で多数回再試行して復旧待ちの取りこぼしを防止する。
# Kibana API への接続タイムアウト秒数 (単位: 秒)
fleet_bootstrap_kibana_api_request_timeout_seconds: 10
# Kibana API への再試行回数 (単位: 回)
# 実環境が開発環境より2-4倍遅い前提で, 最大約25分(5秒 * 300回)の待機予算を確保する。
fleet_bootstrap_kibana_api_retries: 300
# Kibana API への再試行周期秒数 (単位: 秒)
fleet_bootstrap_kibana_api_retry_interval_seconds: 5
# Fleet Output用Elasticsearch hosts health検証の1回あたり要求タイムアウト値 (単位: 秒)
fleet_bootstrap_elasticsearch_health_request_timeout_seconds: 10
# Fleet Output用Elasticsearch hosts health検証の再試行間隔 (単位: 秒)
fleet_bootstrap_elasticsearch_health_retry_interval_seconds: 5
# Fleet Output用Elasticsearch hosts health検証の再試行回数 (単位: 回)
# 実環境が開発環境より2-4倍遅い前提で, 最大約25分(5秒 * 300回)の待機予算を確保する。
fleet_bootstrap_elasticsearch_health_retries: 300
# Fleet Server status 検証の1回あたり要求タイムアウト値 (単位: 秒)
fleet_bootstrap_fleet_server_status_request_timeout_seconds: 10
# Fleet Server status 検証の再試行間隔 (単位: 秒)
fleet_bootstrap_fleet_server_status_retry_interval_seconds: 5
# Fleet Server status 検証の再試行回数 (単位: 回)
# 実環境が開発環境より2-4倍遅い前提で, 最大約25分(5秒 * 300回)の待機予算を確保する。
fleet_bootstrap_fleet_server_status_retries: 300

#
# Fleet Bootstrap に必要な初期化パラメタの規定値
#
# 生成または再利用する Fleet Output の名称
# vars/all-config.ymlでfleet_bootstrap_output_name変数を用いて指定することが推奨される
# 運用であるため, ここでは空文字列を既定値として定義する。
fleet_bootstrap_output_name: ""
# 生成または再利用する Fleet Agent Policy の名称
# vars/all-config.ymlでfleet_bootstrap_policy_name変数を用いて指定することが推奨される
# 運用であるため, ここでは空文字列を既定値として定義する。
fleet_bootstrap_policy_name: ""
# 生成または再利用する Fleet Enrollment Token の名称
# vars/all-config.ymlでfleet_bootstrap_enrollment_token_name変数を用いて指定することが
# 推奨される運用であるため, ここでは空文字列を既定値として定義する。
fleet_bootstrap_enrollment_token_name: ""
# 既存Enrollment TokenがAPI既定の20件を超える場合も指定名を検出できるようにする一覧取得件数。
fleet_bootstrap_enrollment_token_list_page_size: 10000
# Kibana 8.19.19との互換性を確認済みのSystem統合パッケージの版数。
fleet_bootstrap_system_package_version: "2.4.0"
# Kibana 8.19.19との互換性を確認済みのCustom Logs統合パッケージの版数。
fleet_bootstrap_filestream_package_version: "1.2.0"
# Kibana 8.19.19との互換性を確認済みのFleet Server統合パッケージの版数。
fleet_bootstrap_fleet_server_package_version: "1.6.1"
# Kibana 8.19.19との互換性を確認済みのKubernetes統合パッケージの版数。
fleet_bootstrap_kubernetes_package_version: "1.83.1"
# Fleet Server専用Agent Policyへ割り当てるElasticsearch Outputの名称。
fleet_bootstrap_fleet_server_output_name: "fleet-server-elasticsearch-output"
# Fleet Server専用Elasticsearch Outputの送信先一覧明示指定値。
fleet_bootstrap_fleet_server_elasticsearch_hosts_explicit: []
# Fleet Server host 設定に登録する名称
fleet_bootstrap_fleet_server_host_name: "default-fleet-server-host"
# Fleet Output の送信先 Logstash ホスト一覧明示指定値
# Logstash Output は URL ではなく, <ホスト名>:<ポート番号>形式で指定する。
fleet_bootstrap_logstash_hosts_explicit: []
# Fleet Output の送信先 Elasticsearch ホスト一覧 明示指定値
# Fleet API 側のデータ構造に合わせるため, URL 文字列のリストとして定義している。
# 単一URLを指定する場合も, 要素数1のリストで指定する。
# vars/all-config.ymlでlogging_backend_host変数を用いて指定することが推奨される
# 運用であるため, ここでは空リストを既定値として定義する。
fleet_bootstrap_elasticsearch_endpoints_explicit: []
# Fleet Server host 設定に登録する接続先一覧の明示指定値
# Fleet API 側のデータ構造に合わせるため, URL 文字列のリストとして定義している。
# 単一URLを指定する場合も, 要素数1のリストで指定する。
# vars/all-config.ymlでlogging_backend_host変数を用いて指定することが推奨される
# 運用であるため, ここでは空リストを既定値として定義する。
fleet_bootstrap_fleet_server_host_urls_explicit: []
# Kubernetes kube-system名前空間のコンテナログを収集するファイルパス一覧。
logging_elastic_agent_k8s_system_kube_system_log_paths:
  - "/var/log/containers/*_kube-system_*.log"

#
# Kubernetes統合Package Policy の収集対象
#
# Kubernetes統合Packageからdeployment情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_deployment_enabled: true
# Kubernetes統合Packageからstatefulset情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_statefulset_enabled: true
# Kubernetes統合Packageからpod情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_pod_enabled: true
# Kubernetes統合Packageからnode情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_node_enabled: true
# Kubernetes統合Packageからnamespace情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_namespace_enabled: true
# eventを収集する場合は, trueを指定する。
fleet_bootstrap_k8s_event_enabled: true
# Kubernetes統合Packageからdaemonset情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_daemonset_enabled: true
# Kubernetes統合Packageからreplicaset情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_replicaset_enabled: true
# Kubernetes統合Packageからjob情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_job_enabled: true
# Kubernetes統合Packageからstorageclass情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_storageclass_enabled: true
# Kubernetes統合Packageからpersistentvolume情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_persistentvolume_enabled: true
# Kubernetes統合Packageからpersistentvolumeclaim情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_persistentvolumeclaim_enabled: true
# Kubernetes統合Packageからresourcequota情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_resourcequota_enabled: true
# Kubernetes統合Packageからservice情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_service_enabled: true
# Kubernetes統合Packageからcronjob情報を収集する場合は, trueを指定する。
fleet_bootstrap_k8s_state_cronjob: false

#
# デバッグ動作制御変数
#
# 認証切り分け用の補助 debug 出力有無。通常運用では false のままとする
fleet_bootstrap_debug_auth_diagnostics: false
