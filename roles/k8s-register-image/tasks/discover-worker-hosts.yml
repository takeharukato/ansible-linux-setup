#
#  worker ノード自動検出タスク
#
---

# 既存呼び出し元との互換性を保ちながら, worker状態確認用kubeconfigを従来と同じ優先順位で解決する。
# 処理ロジック:
# 1. k8s_register_image_kubeconfig_to_discover_workers_pathを最優先する。
# 2. 未指定時はk8s_kubeconfig_to_discover_workers_pathを使用する。
# 3. 未指定時はk8s_supercluster_kubeconfig_pathを使用する。
# 4. 最後にk8s_admin_kubeconfig_pathを使用する。
# 対応するJinja2式: (k8s_register_image_kubeconfig_to_discover_workers_path | default(k8s_kubeconfig_to_discover_workers_path, true) | default(k8s_supercluster_kubeconfig_path, true) | default(k8s_admin_kubeconfig_path, true))
- name: "Resolve kubeconfig path to discover worker hosts"
  ansible.builtin.set_fact:
    k8s_register_image_runtime_kubeconfig_to_discover_workers_path: >-
      {{
        k8s_register_image_kubeconfig_to_discover_workers_path
        | default(k8s_kubeconfig_to_discover_workers_path, true)
        | default(k8s_supercluster_kubeconfig_path, true)
        | default(k8s_admin_kubeconfig_path, true)
      }}

# worker選択, Ready待機, worker取得, InternalIP対応表生成をk8s-cluster-readyへ集約し, 同目的処理を共通化する。
# 呼び出し先ロールの入力変数は, Multus/Whereaboutsからk8s-helm-commonを呼び出す既存方式と同様に,
# blockのvarsでまとめて渡すことでロール間の変数境界を明示する。
- name: "Discover worker hosts with k8s-cluster-ready"
  vars:
    k8s_cluster_ready_kubeconfig_path: "{{ k8s_register_image_runtime_kubeconfig_to_discover_workers_path }}"
    k8s_cluster_ready_wait_for_worker_ready_enabled: "{{ k8s_register_image_wait_for_worker_ready_enabled | bool }}"
    k8s_cluster_ready_wait_for_worker_ready_timeout_seconds: "{{ k8s_register_image_wait_for_worker_ready_timeout | int }}"
    k8s_cluster_ready_wait_for_worker_ready_fail_on_timeout: "{{ k8s_register_image_wait_for_worker_ready_fail_on_timeout | bool }}"
    k8s_cluster_ready_wait_retry_enabled: "{{ k8s_register_image_wait_for_worker_ready_retry_enabled | bool }}"
    k8s_cluster_ready_wait_retries: "{{ k8s_register_image_wait_for_worker_ready_retries | int }}"
    k8s_cluster_ready_wait_retry_interval_seconds: "{{ k8s_register_image_wait_for_worker_ready_retry_interval_seconds | int }}"
    k8s_cluster_ready_worker_discovery_request_timeout_seconds: "{{ k8s_register_image_worker_discovery_request_timeout_seconds | int }}"
    k8s_cluster_ready_worker_discovery_retry_enabled: "{{ k8s_register_image_worker_discovery_retry_enabled | bool }}"
    k8s_cluster_ready_worker_discovery_retries: "{{ k8s_register_image_worker_discovery_retries | int }}"
    k8s_cluster_ready_worker_discovery_retry_interval_seconds: "{{ k8s_register_image_worker_discovery_retry_interval_seconds | int }}"
  block:
    # worker状態確認の実処理はk8s-cluster-readyへ委譲し, 呼び出し元ごとの重複実装を防ぐ。
    - name: "Run k8s-cluster-ready worker discovery"
      ansible.builtin.include_role:
        name: k8s-cluster-ready
        tasks_from: worker-ready.yml

# k8s-register-imageを直接利用する既存ロールを変更せずに済むよう, 共通処理結果を既存公開変数へ変換する。
- name: "Set k8s-register-image worker discovery results"
  ansible.builtin.set_fact:
    k8s_register_image_worker_ready_wait_result: "{{ k8s_cluster_ready_worker_ready_wait_result | default({}) }}"
    k8s_register_image_worker_nodes_result: "{{ k8s_cluster_ready_worker_nodes_result | default({}) }}"
    k8s_register_image_worker_hosts: "{{ k8s_cluster_ready_worker_hosts | default([], true) }}"
    k8s_register_image_worker_node_internal_ip_map: "{{ k8s_cluster_ready_worker_node_internal_ip_map | default({}, true) }}"
