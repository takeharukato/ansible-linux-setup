#
#  ロール固有変数のデフォルト値
#  group_vars/all/all.yml やhost_varsで上書き可能とするため,
#  ロール名/defaults/main.yml に定義している
#  本ロールは他のロールから呼び出されることを想定しているため,
#  defaults/main.yml に定義する値はすべて空定義である。
---

# 登録対象コンポーネント名と tar パスの対応表
k8s_register_image_components: {}

# コンポーネント名 -> 期待タグ の対応表
k8s_register_image_expected_images: {}

# 登録対象 control plane ホスト一覧
k8s_register_image_control_plane_hosts: []

# 登録対象 worker ホスト一覧
k8s_register_image_worker_hosts: []

# worker ホスト一覧を自動解決するかどうか
k8s_register_image_auto_discover_worker_hosts: false

# 呼び出し元で control plane ホスト一覧を組み立てる際のインベントリグループ名
k8s_register_image_control_plane_group_name: "k8s_ctrl_plane"

# worker 自動解決時に kubectl で参照する kubeconfig パス
k8s_kubeconfig_to_discover_workers_path: ""

# register-* タスクで discover-target-hosts.yml の再実行を抑止するかどうか
k8s_register_image_skip_discovery: false

# 対象ノード上の一時 tar 配置先
k8s_register_image_remote_cache_dir: "/tmp/k8s-register-image"

# 未修飾名に付与する既定レジストリ名
k8s_register_image_unqualified_image_registry: "docker.io"

# 対象ノード上の一時 tar を削除するかどうか
k8s_register_image_cleanup_remote_tar: true

# 各対象ノードへ処理を開始する前の接続プリフライト有効化フラグ
k8s_register_image_connection_preflight_enabled: true
# 接続プリフライト全体の待機タイムアウト秒数
k8s_register_image_connection_preflight_timeout: 300
# 接続プリフライト時の1回あたり接続タイムアウト秒数
k8s_register_image_connection_preflight_connect_timeout: 15
# 接続プリフライト開始前の遅延秒数
k8s_register_image_connection_preflight_delay_seconds: 0
# 接続プリフライトのポーリング間隔秒数
k8s_register_image_connection_preflight_sleep_seconds: 5

# 画像tar転送(copy)時の再試行有効化フラグ
k8s_register_image_transfer_retry_enabled: true
# 画像tar転送(copy)時の最大試行回数
k8s_register_image_transfer_retries: 3
# 画像tar転送(copy)時の試行間隔秒数
k8s_register_image_transfer_retry_delay_seconds: 5

# worker検出前に Ready 条件を待機するかどうか
k8s_register_image_wait_for_worker_ready_enabled: true
# worker Ready 待機タイムアウト秒数
k8s_register_image_wait_for_worker_ready_timeout: 180
# worker Ready 待機の失敗を致命エラーとするかどうか
k8s_register_image_wait_for_worker_ready_fail_on_timeout: false

# worker検出コマンド実行時の再試行有効化フラグ
k8s_register_image_worker_discovery_retry_enabled: true
# worker検出コマンド実行時の最大試行回数
k8s_register_image_worker_discovery_retries: 3
# worker検出コマンド実行時の試行間隔秒数
k8s_register_image_worker_discovery_retry_delay_seconds: 5
