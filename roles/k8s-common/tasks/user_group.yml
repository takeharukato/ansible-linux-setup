# k8sオペレータ用グループを作成
- name: "Create {{ k8s_operator_user }} group"
  ansible.builtin.group:
    name: "{{ k8s_operator_user }}"

# k8sオペレータ用ユーザを作成
# note: K8sオペレータ用グループへ所属させるため、先にグループを作成しておくこと
- name: "Create {{ k8s_operator_user }} user"
  ansible.builtin.user:
    name: "{{ k8s_operator_user }}"
    group: "{{ k8s_operator_user }}"
    shell: "{{ k8s_operator_shell }}"
    groups: "{{ k8s_operator_groups_list }}"
    append: true
  register: k8s_common_operator_user_result

# ホームディレクトリを作成
- name: "Make {{ k8s_operator_user }} home dir"
  vars:
    k8s_operator_home: "{{ k8s_common_operator_user_result.home | default('', true) | string | trim }}"
  ansible.builtin.file:
    path: "{{ k8s_operator_home }}"
    state: directory
    owner: "{{ k8s_operator_user }}"
    group: "{{ k8s_operator_user }}"
    mode: "0755"
  when:
    - (k8s_operator_home | length) > 0
