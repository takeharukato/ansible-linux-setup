#
#  k8s オペレータホームディレクトリ解決タスク
#
---

# k8s オペレータユーザ作成後の実ホームを参照できるように, passwd 情報を取得する。
- name: Resolve passwd entry for k8s operator user
  ansible.builtin.getent:
    database: passwd
    key: "{{ k8s_operator_user }}"
  register: k8s_operator_home_getent
  changed_when: false

# 後続タスクが同じ実ホームを参照し, ルート直下へ .ssh を作成しないため, passwd のホーム欄を両方の共有ファクトへ格納する。
# passwd 配列のユーザ名を除く5番目の要素はホームディレクトリである (k8s_operator_home_getent.ansible_facts.getent_passwd[k8s_operator_user][4])。
- name: Record resolved home directory for k8s operator user
  ansible.builtin.set_fact:
    k8s_operator_home: "{{ k8s_operator_home_getent.ansible_facts.getent_passwd[k8s_operator_user][4] }}"
    k8s_operator_home_resolved: "{{ k8s_operator_home_getent.ansible_facts.getent_passwd[k8s_operator_user][4] }}"
  changed_when: false
