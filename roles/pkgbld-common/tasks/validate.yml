#  -*- coding:utf-8 mode:yaml -*-
#  Ansible playbook
#
#  入力検証
#

---

# 共通ロール実行に必要な入力変数を検証する
- name: Validate required variables for pkgbld-common
  ansible.builtin.assert:
    that:
      - package_build_host is string
      - package_build_host | length > 0
      - package_build_workspace is string
      - package_build_workspace | length > 0
      - package_build_output_dir is string
      - package_build_output_dir | length > 0
      - pkgbld_build_script_src is string
      - pkgbld_build_script_src | length > 0
      - pkgbld_build_script_name is string
      - pkgbld_build_script_name | length > 0
      - pkgbld_package_type in ['deb', 'rpm']
      - pkgbld_package_name is string
      - pkgbld_package_name | length > 0
      - package_targets is sequence
      - package_targets | length > 0
    fail_msg: "pkgbld-common required variables are missing or invalid."

# Debian 系ノード向けのビルダーイメージ指定を検証する
- name: Validate builder image for Debian family
  ansible.builtin.assert:
    that:
      - pkgbld_builder_image_debian is string
      - pkgbld_builder_image_debian | length > 0
    fail_msg: "pkgbld_builder_image_debian is required for Debian family builds."
  when: ansible_facts.os_family == 'Debian'

# RedHat 系ノード向けのビルダーイメージ指定を検証する
- name: Validate builder image for RedHat family
  ansible.builtin.assert:
    that:
      - pkgbld_builder_image_rhel is string
      - pkgbld_builder_image_rhel | length > 0
    fail_msg: "pkgbld_builder_image_rhel is required for RedHat family builds."
  when: ansible_facts.os_family == 'RedHat'

# Debian 系成果物の探索パターン指定を検証する
- name: Validate package file patterns for Debian family
  ansible.builtin.assert:
    that:
      - pkgbld_package_file_patterns_debian is sequence
      - pkgbld_package_file_patterns_debian | length > 0
    fail_msg: "pkgbld_package_file_patterns_debian must be non-empty for Debian family."
  when: ansible_facts.os_family == 'Debian'

# RedHat 系成果物の探索パターン指定を検証する
- name: Validate package file patterns for RedHat family
  ansible.builtin.assert:
    that:
      - pkgbld_package_file_patterns_rhel is sequence
      - pkgbld_package_file_patterns_rhel | length > 0
    fail_msg: "pkgbld_package_file_patterns_rhel must be non-empty for RedHat family."
  when: ansible_facts.os_family == 'RedHat'

# package_targets を基に Debian/RedHat 対象の有無を run_once 用 fact として算出する
# 処理論理:
# host_vars のキーからホスト名を取得し, package_targets に含まれるホストのうち
# Debian 系/RedHat 系のホストを取得し, それぞれの対象が1つ以上存在する場合に true を返す
# これにより, run_once タスク内で対象 OS ファミリの有無を判定できるようにする
# value.ansible_facts.os_family, value.ansible_os_family の両方を考慮することで,
# ansible_facts が未収集のホストでも OS ファミリ判定が可能となる
- name: Detect target OS families for pkgbld-common run_once tasks
  ansible.builtin.set_fact:
    pkgbld_has_debian_targets: >-
      {{
        (
          (
            hostvars
            | dict2items
            | selectattr('key', 'in', package_targets)
            | selectattr('value.ansible_facts.os_family', 'defined')
            | selectattr('value.ansible_facts.os_family', 'equalto', 'Debian')
            | list
            | length
          )
          +
          (
            hostvars
            | dict2items
            | selectattr('key', 'in', package_targets)
            | rejectattr('value.ansible_facts.os_family', 'defined')
            | selectattr('value.ansible_os_family', 'defined')
            | selectattr('value.ansible_os_family', 'equalto', 'Debian')
            | list
            | length
          )
        ) > 0
      }}
    pkgbld_has_redhat_targets: >-
      {{
        (
          (
            hostvars
            | dict2items
            | selectattr('key', 'in', package_targets)
            | selectattr('value.ansible_facts.os_family', 'defined')
            | selectattr('value.ansible_facts.os_family', 'equalto', 'RedHat')
            | list
            | length
          )
          +
          (
            hostvars
            | dict2items
            | selectattr('key', 'in', package_targets)
            | rejectattr('value.ansible_facts.os_family', 'defined')
            | selectattr('value.ansible_os_family', 'defined')
            | selectattr('value.ansible_os_family', 'equalto', 'RedHat')
            | list
            | length
          )
        ) > 0
      }}
  delegate_to: localhost
  delegate_facts: true
  run_once: true

# build スクリプトの元ファイルが制御ホスト上に存在するかを確認する
- name: Validate build script exists on controller
  ansible.builtin.stat:
    path: "{{ pkgbld_build_script_src_debian }}"
  register: pkgbld_build_script_src_stat_debian
  delegate_to: localhost
  become: false
  run_once: true
  when: hostvars['localhost'].pkgbld_has_debian_targets | default(false)

# RedHat 向け build スクリプトの元ファイルが制御ホスト上に存在するかを確認する
- name: Validate RedHat build script exists on controller
  ansible.builtin.stat:
    path: "{{ pkgbld_build_script_src_rhel }}"
  register: pkgbld_build_script_src_stat_rhel
  delegate_to: localhost
  become: false
  run_once: true
  when: hostvars['localhost'].pkgbld_has_redhat_targets | default(false)

# build スクリプト元ファイルが存在しない場合は早期に停止する
- name: Fail when build script source file does not exist on controller
  ansible.builtin.fail:
    msg: "Build script source does not exist on controller: {{ pkgbld_build_script_src_debian }}"
  when:
    - hostvars['localhost'].pkgbld_has_debian_targets | default(false)
    - not (pkgbld_build_script_src_stat_debian.stat.exists | default(false))
  run_once: true

# RedHat 向け build スクリプト元ファイルが存在しない場合は早期に停止する
- name: Fail when RedHat build script source file does not exist on controller
  ansible.builtin.fail:
    msg: "Build script source does not exist on controller: {{ pkgbld_build_script_src_rhel }}"
  when:
    - hostvars['localhost'].pkgbld_has_redhat_targets | default(false)
    - not (pkgbld_build_script_src_stat_rhel.stat.exists | default(false))
  run_once: true
