#
#  Enrollment Token読み込みタスク
#
---

# Fleet Bootstrapが生成したEnrollment Token共有ファイルの存在と属性を確認する。
- name: Check Fleet enrollment token file on controller
  ansible.builtin.stat:
    path: "{{ fleet_bootstrap_enrollment_token_file }}"
  register: elastic_agent_k8s_audit_enrollment_token_file_stat
  delegate_to: localhost
  become: false

# Fleet Bootstrap未完了を導入処理前に検出し,
# 秘密値がない状態でElastic Agent登録処理が進むことを防止する。
- name: Validate Fleet enrollment token file
  ansible.builtin.assert:
    that:
      - elastic_agent_k8s_audit_enrollment_token_file_stat.stat.exists | default(false) | bool
      - elastic_agent_k8s_audit_enrollment_token_file_stat.stat.isreg | default(false) | bool
      - elastic_agent_k8s_audit_enrollment_token_file_stat.stat.mode | default('') == '0600'
    fail_msg: >-
      Fleet enrollment token file is missing, invalid, or does not have mode 0600.
      Run Fleet Bootstrap before elastic-agent-k8s-audit.

# 同一playbook実行中に生成されたEnrollment Token共有ファイルも利用できるように,
# Enrollment Token情報を明示的に読み込む。
- name: Load Fleet enrollment token from file
  ansible.builtin.include_vars:
    file: "{{ fleet_bootstrap_enrollment_token_file }}"

# 本ロールはk8s_audit構成種別向けのEnrollment Tokenを使用するため,
# 選択プロファイルを固定する。
- name: Resolve Fleet enrollment token profile
  ansible.builtin.set_fact:
    elastic_agent_k8s_audit_runtime_enrollment_token_profile: "k8s_audit"

# 選択したAgent Policyへ登録するEnrollment Tokenを
# Elastic Agentポリシーごとの辞書から取得する。
- name: Select Fleet enrollment token
  ansible.builtin.set_fact:
    elastic_agent_k8s_audit_runtime_enrollment_token: >-
      {{
        (
          elastic_agent_enrollment_tokens
          | default({})
        ).get(
          elastic_agent_k8s_audit_runtime_enrollment_token_profile,
          ''
        )
        | default('')
      }}

# k8s_audit用Enrollment Tokenが取得できたことを確認する。
# Token自体は秘密情報であるため, エラーメッセージには出力しない。
- name: Validate Fleet enrollment token
  ansible.builtin.assert:
    that:
      - >-
        (
          elastic_agent_k8s_audit_runtime_enrollment_token
          | default('', true)
          | string
          | trim
          | length
        ) > 0
    fail_msg: >-
      Fleet enrollment token for the k8s_audit Agent Policy was not found.
      Run Fleet Bootstrap before elastic-agent-k8s-audit.
