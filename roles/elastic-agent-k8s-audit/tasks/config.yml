---

# Kubernetes API監査ログ収集用Elastic AgentのHelm valuesファイルを生成する。
# valuesファイルにはFleet Enrollment Tokenが含まれるため,
# Helm代表実行ユーザだけが読み書き可能な権限で配置する。
- name: Generate Helm values for elastic-agent-k8s-audit
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ elastic_agent_k8s_audit_runtime_values_file_path }}"
    owner: "{{ k8s_runtime_helm_operator_user }}"
    mode: "0600"

# Helmテンプレート描画を先に実行し, Chartとvaluesの整合性を導入前に確認する。
- name: Render elastic-agent-k8s-audit Helm template
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - template
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - "{{ elastic_agent_k8s_audit_runtime_chart_ref }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --version
      - "{{ elastic_agent_k8s_audit_runtime_chart_version }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - -f
      - "{{ elastic_agent_k8s_audit_runtime_values_file_path }}"
  register: elastic_agent_k8s_audit_helm_template_result
  changed_when: false
  become: true
  until: elastic_agent_k8s_audit_helm_template_result.rc == 0
  retries: "{{ elastic_agent_k8s_audit_runtime_helm_retries | int }}"
  delay: "{{ elastic_agent_k8s_audit_runtime_helm_retry_interval_seconds | int }}"

# Audit Agentがホストネットワークを使用しない設定で
# 描画されていることを確認する。
- name: Validate rendered template does not enable hostNetwork
  ansible.builtin.assert:
    that:
      - >-
        not (
          (
            elastic_agent_k8s_audit_helm_template_result.stdout
            | default('', true)
          )
          is regex('(?m)^\s*hostNetwork:\s*true\s*$')
        )
    fail_msg: >-
      Rendered elastic-agent-k8s-audit Helm manifest enables hostNetwork.

# kube-state-metricsをAudit専用releaseで生成していないことを確認する。
- name: Validate rendered template does not include kube-state-metrics
  ansible.builtin.assert:
    that:
      - >-
        'kube-state-metrics'
        not in (
          elastic_agent_k8s_audit_helm_template_result.stdout
          | default('', true)
        )
    fail_msg: >-
      Rendered elastic-agent-k8s-audit Helm manifest includes
      kube-state-metrics resources.

# 描画結果にDaemonSetが含まれることを確認し,
# Audit Agentがノード単位で配置される設定であることを保証する。
- name: Validate rendered template includes DaemonSet
  ansible.builtin.assert:
    that:
      - >-
        (
          elastic_agent_k8s_audit_helm_template_result.stdout
          | default('', true)
        )
        is regex('(?m)^kind:\s*DaemonSet\s*$')
    fail_msg: >-
      Rendered elastic-agent-k8s-audit Helm manifest does not include DaemonSet.

# Kubernetes API監査ログ用volumeMountがread-onlyで描画されていることを確認する。
- name: Validate rendered template includes audit volume mount
  ansible.builtin.assert:
    that:
      - >-
        (
          elastic_agent_k8s_audit_helm_template_result.stdout
          | default('', true)
        )
        is regex(
          '(?m)^\s*-\s*mountPath:\s*'
          ~ (elastic_agent_k8s_audit_container_log_dir | regex_escape)
          ~ '\s*\n'
          ~ '\s*name:\s*kubernetes-audit-log\s*\n'
          ~ '\s*readOnly:\s*true\s*$'
        )
    fail_msg: >-
      Rendered elastic-agent-k8s-audit Helm manifest does not include
      the required read-only Kubernetes audit volume mount.

# Helm release状態を事前に取得し, 進行中状態の検出可否を明確にする。
- name: Get elastic-agent-k8s-audit Helm release status before upgrade
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - status
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - -o
      - json
  register: elastic_agent_k8s_audit_pre_upgrade_status_result
  changed_when: false
  failed_when: false
  become: true

# uninstalling状態は削除処理の遷移中であるため,
# 進行中の削除が完了するまで状態遷移を待機する。
- name: Wait for uninstalling elastic-agent-k8s-audit release state to complete before upgrade
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - status
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - -o
      - json
  register: elastic_agent_k8s_audit_status_wait_uninstalling_result
  changed_when: false
  failed_when: false
  become: true
  until: >-
    elastic_agent_k8s_audit_status_wait_uninstalling_result.rc != 0
    or
    (
      (
        elastic_agent_k8s_audit_status_wait_uninstalling_result.stdout
        | from_json
      ).info.status
      != 'uninstalling'
    )
  retries: "{{ elastic_agent_k8s_audit_runtime_helm_retries | int }}"
  delay: "{{ elastic_agent_k8s_audit_runtime_helm_request_interval_seconds | int }}"
  when:
    - elastic_agent_k8s_audit_pre_upgrade_status_result.rc == 0
    - >-
      (
        elastic_agent_k8s_audit_pre_upgrade_status_result.stdout
        | from_json
      ).info.status == 'uninstalling'

# uninstalling待機の有無にかかわらず,
# 後続判定で使用するrelease状態を1つに集約する。
- name: Select effective pre-upgrade elastic-agent-k8s-audit Helm release status
  ansible.builtin.set_fact:
    elastic_agent_k8s_audit_pre_upgrade_status_effective_result: >-
      {{
        elastic_agent_k8s_audit_status_wait_uninstalling_result
        if (
          elastic_agent_k8s_audit_pre_upgrade_status_result.rc == 0
          and
          (
            elastic_agent_k8s_audit_pre_upgrade_status_result.stdout
            | from_json
          ).info.status == 'uninstalling'
        )
        else elastic_agent_k8s_audit_pre_upgrade_status_result
      }}

# 導入前の解消処理要否をboolへ正規化し,
# 後続タスクの条件式を単純化する。
- name: Decide elastic-agent-k8s-audit pre-upgrade cleanup flags
  ansible.builtin.set_fact:
    elastic_agent_k8s_audit_should_delete_pending_secret: >-
      {{
        elastic_agent_k8s_audit_pre_upgrade_status_effective_result.rc == 0
        and
        (
          (
            elastic_agent_k8s_audit_pre_upgrade_status_effective_result.stdout
            | from_json
          ).info.status
          in ['pending-install', 'pending-upgrade', 'pending-rollback']
        )
      }}
    elastic_agent_k8s_audit_should_uninstall_existing_release: >-
      {{
        elastic_agent_k8s_audit_pre_upgrade_status_effective_result.rc == 0
        and
        (
          (
            elastic_agent_k8s_audit_pre_upgrade_status_effective_result.stdout
            | from_json
          ).info.status
          == 'uninstalled'
        )
      }}

# pending状態を検出した場合のみ,
# 実行中操作解消のため対象revisionのrelease Secretを削除する。
- name: Delete pending elastic-agent-k8s-audit Helm release secret before upgrade
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - kubectl
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - delete
      - secret
      - >-
        sh.helm.release.v1.{{ elastic_agent_k8s_audit_runtime_release_name }}.v{{ (elastic_agent_k8s_audit_pre_upgrade_status_effective_result.stdout | from_json).version }}
  register: elastic_agent_k8s_audit_pending_secret_delete_result
  changed_when: elastic_agent_k8s_audit_pending_secret_delete_result.rc == 0
  failed_when: elastic_agent_k8s_audit_pending_secret_delete_result.rc != 0
  become: true
  when:
    - elastic_agent_k8s_audit_should_delete_pending_secret | bool

# uninstalled状態の履歴残存を削除し, 再導入可能な状態へ戻す。
- name: Uninstall existing elastic-agent-k8s-audit Helm release before upgrade
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - uninstall
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - --ignore-not-found
  register: elastic_agent_k8s_audit_helm_uninstall_result
  changed_when: >-
    'uninstall' in (
      elastic_agent_k8s_audit_helm_uninstall_result.stdout
      | default('', true)
      | lower
    )
  failed_when: elastic_agent_k8s_audit_helm_uninstall_result.rc != 0
  become: true
  when:
    - elastic_agent_k8s_audit_should_uninstall_existing_release | bool

# 進行中操作の解消結果を確認する。
- name: Get elastic-agent-k8s-audit Helm release status after pending cleanup
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - status
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - -o
      - json
  register: elastic_agent_k8s_audit_post_cleanup_status_result
  changed_when: false
  failed_when: false
  become: true

# 解消処理後もpending状態が残っている場合は停止する。
- name: Assert elastic-agent-k8s-audit Helm release is not pending before upgrade
  ansible.builtin.assert:
    that:
      - >-
        elastic_agent_k8s_audit_post_cleanup_status_result.rc != 0
        or
        (
          (
            elastic_agent_k8s_audit_post_cleanup_status_result.stdout
            | from_json
          ).info.status
          not in ['pending-install', 'pending-upgrade', 'pending-rollback']
        )
    fail_msg: >-
      Helm release is still in pending state after cleanup.
      Resolve in-progress install/upgrade/rollback before retrying upgrade.

# 検証済みテンプレートと同一入力で導入し, まず初回適用結果を取得する。
- name: Install or upgrade elastic-agent-k8s-audit via Helm (first attempt)
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - upgrade
      - --install
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - "{{ elastic_agent_k8s_audit_runtime_chart_ref }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --create-namespace
      - --version
      - "{{ elastic_agent_k8s_audit_runtime_chart_version }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - --wait
      - --timeout
      - "{{ elastic_agent_k8s_audit_runtime_helm_timeout_seconds | int }}s"
      - -f
      - "{{ elastic_agent_k8s_audit_runtime_values_file_path }}"
  register: elastic_agent_k8s_audit_helm_upgrade_first_result
  failed_when: false
  become: true
  changed_when: >-
    (
      'STATUS: deployed' in (
        elastic_agent_k8s_audit_helm_upgrade_first_result.stdout
        | default('', true)
      )
    ) or (
      'STATUS: upgraded' in (
        elastic_agent_k8s_audit_helm_upgrade_first_result.stdout
        | default('', true)
      )
    )

# 初回失敗時は現在のrelease状態を再取得する。
- name: Get elastic-agent-k8s-audit Helm release status after failed first attempt
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - status
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - -o
      - json
  register: elastic_agent_k8s_audit_failed_upgrade_status_result
  changed_when: false
  failed_when: false
  become: true
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0

# 初回失敗後にuninstalling状態であれば,
# 状態遷移完了まで待機して競合を回避する。
- name: Wait for uninstalling elastic-agent-k8s-audit release state before retry
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - status
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - -o
      - json
  register: elastic_agent_k8s_audit_status_wait_uninstalling_for_retry_result
  changed_when: false
  failed_when: false
  become: true
  until: >-
    elastic_agent_k8s_audit_status_wait_uninstalling_for_retry_result.rc != 0
    or
    (
      (
        elastic_agent_k8s_audit_status_wait_uninstalling_for_retry_result.stdout
        | from_json
      ).info.status
      != 'uninstalling'
    )
  retries: "{{ elastic_agent_k8s_audit_runtime_helm_retries | int }}"
  delay: "{{ elastic_agent_k8s_audit_runtime_helm_request_interval_seconds | int }}"
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0
    - elastic_agent_k8s_audit_failed_upgrade_status_result.rc == 0
    - >-
      (
        elastic_agent_k8s_audit_failed_upgrade_status_result.stdout
        | from_json
      ).info.status == 'uninstalling'

# 初回失敗後の実効release状態を1つに集約する。
- name: Select effective failed-upgrade elastic-agent-k8s-audit Helm release status
  ansible.builtin.set_fact:
    elastic_agent_k8s_audit_failed_upgrade_status_effective_result: >-
      {{
        elastic_agent_k8s_audit_status_wait_uninstalling_for_retry_result
        if (
          elastic_agent_k8s_audit_failed_upgrade_status_result.rc == 0
          and
          (
            elastic_agent_k8s_audit_failed_upgrade_status_result.stdout
            | from_json
          ).info.status == 'uninstalling'
        )
        else elastic_agent_k8s_audit_failed_upgrade_status_result
      }}
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0

# 初回失敗後のrelease状態から,
# pending Secret削除又はrelease削除の要否を解決する。
- name: Decide elastic-agent-k8s-audit cleanup flags after failed first attempt
  ansible.builtin.set_fact:
    elastic_agent_k8s_audit_should_delete_pending_secret_after_failed_upgrade: >-
      {{
        elastic_agent_k8s_audit_failed_upgrade_status_effective_result.rc == 0
        and
        (
          (
            elastic_agent_k8s_audit_failed_upgrade_status_effective_result.stdout
            | from_json
          ).info.status
          in ['pending-install', 'pending-upgrade', 'pending-rollback']
        )
      }}
    elastic_agent_k8s_audit_should_uninstall_existing_release_after_failed_upgrade: >-
      {{
        elastic_agent_k8s_audit_failed_upgrade_status_effective_result.rc == 0
        and
        (
          (
            elastic_agent_k8s_audit_failed_upgrade_status_effective_result.stdout
            | from_json
          ).info.status
          == 'uninstalled'
        )
      }}
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0

# 初回失敗後にpending状態が残る場合は,
# 対象revisionのrelease Secretを削除して再試行可能状態へ戻す。
- name: Delete pending elastic-agent-k8s-audit Helm release secret before retry
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - kubectl
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - delete
      - secret
      - >-
        sh.helm.release.v1.{{ elastic_agent_k8s_audit_runtime_release_name }}.v{{ (elastic_agent_k8s_audit_failed_upgrade_status_effective_result.stdout | from_json).version }}
  register: elastic_agent_k8s_audit_pending_secret_delete_after_failed_upgrade_result
  changed_when: >-
    elastic_agent_k8s_audit_pending_secret_delete_after_failed_upgrade_result.rc == 0
  failed_when: >-
    elastic_agent_k8s_audit_pending_secret_delete_after_failed_upgrade_result.rc != 0
  become: true
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0
    - elastic_agent_k8s_audit_should_delete_pending_secret_after_failed_upgrade | bool

# 初回失敗後にuninstalled状態の場合は,
# release情報を削除して再導入可能な状態へ戻す。
- name: Uninstall existing elastic-agent-k8s-audit Helm release before retry
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - uninstall
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - --ignore-not-found
  register: elastic_agent_k8s_audit_helm_uninstall_after_failed_upgrade_result
  changed_when: >-
    'uninstall' in (
      elastic_agent_k8s_audit_helm_uninstall_after_failed_upgrade_result.stdout
      | default('', true)
      | lower
    )
  failed_when: >-
    elastic_agent_k8s_audit_helm_uninstall_after_failed_upgrade_result.rc != 0
  become: true
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0
    - elastic_agent_k8s_audit_should_uninstall_existing_release_after_failed_upgrade | bool

# 初回失敗後の解消処理結果を再取得し,
# pending状態が実際に解消されたことを確認できるようにする。
- name: Get elastic-agent-k8s-audit Helm release status after failed-upgrade cleanup
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - status
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - -o
      - json
  register: elastic_agent_k8s_audit_failed_upgrade_post_cleanup_status_result
  changed_when: false
  failed_when: false
  become: true
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0

# cleanup後にpending状態が残っていないことを確認する。
- name: Assert elastic-agent-k8s-audit Helm release is not pending before retry
  ansible.builtin.assert:
    that:
      - >-
        elastic_agent_k8s_audit_failed_upgrade_post_cleanup_status_result.rc != 0
        or
        (
          (
            elastic_agent_k8s_audit_failed_upgrade_post_cleanup_status_result.stdout
            | from_json
          ).info.status
          not in ['pending-install', 'pending-upgrade', 'pending-rollback']
        )
    fail_msg: >-
      Helm release is still in pending state after failed-upgrade cleanup.
      Resolve in-progress install/upgrade/rollback before retrying upgrade.
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0

# 初回失敗時のみ, 状態解消後に同一入力でupgrade処理を再試行する。
- name: Install or upgrade elastic-agent-k8s-audit via Helm (retry after cleanup)
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ k8s_runtime_helm_operator_user }}"
      - helm
      - upgrade
      - --install
      - "{{ elastic_agent_k8s_audit_runtime_release_name }}"
      - "{{ elastic_agent_k8s_audit_runtime_chart_ref }}"
      - --namespace
      - "{{ elastic_agent_k8s_audit_runtime_namespace }}"
      - --create-namespace
      - --version
      - "{{ elastic_agent_k8s_audit_runtime_chart_version }}"
      - --kubeconfig
      - "{{ elastic_agent_k8s_audit_runtime_kubeconfig_path }}"
      - --wait
      - --timeout
      - "{{ elastic_agent_k8s_audit_runtime_helm_timeout_seconds | int }}s"
      - -f
      - "{{ elastic_agent_k8s_audit_runtime_values_file_path }}"
  register: elastic_agent_k8s_audit_helm_upgrade_retry_result
  failed_when: false
  become: true
  until: elastic_agent_k8s_audit_helm_upgrade_retry_result.rc == 0
  retries: "{{ elastic_agent_k8s_audit_runtime_helm_retries | int }}"
  delay: "{{ elastic_agent_k8s_audit_runtime_helm_retry_interval_seconds | int }}"
  changed_when: >-
    (
      'STATUS: deployed' in (
        elastic_agent_k8s_audit_helm_upgrade_retry_result.stdout
        | default('', true)
      )
    ) or (
      'STATUS: upgraded' in (
        elastic_agent_k8s_audit_helm_upgrade_retry_result.stdout
        | default('', true)
      )
    )
  when:
    - elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0

# 初回成功時は初回結果を採用し,
# 初回失敗時は再試行結果を採用して最終結果を統一する。
- name: Select effective elastic-agent-k8s-audit Helm upgrade result
  ansible.builtin.set_fact:
    elastic_agent_k8s_audit_helm_upgrade_result: >-
      {{
        elastic_agent_k8s_audit_helm_upgrade_retry_result
        if (elastic_agent_k8s_audit_helm_upgrade_first_result.rc != 0)
        else elastic_agent_k8s_audit_helm_upgrade_first_result
      }}

# 最終的にupgradeが成功していることを検証し,
# 失敗時はstderrを付けて停止する。
- name: Assert elastic-agent-k8s-audit Helm upgrade succeeded
  ansible.builtin.assert:
    that:
      - elastic_agent_k8s_audit_helm_upgrade_result.rc == 0
    fail_msg: >-
      Helm upgrade failed for elastic-agent-k8s-audit.
      stderr={{
        elastic_agent_k8s_audit_helm_upgrade_result.stderr
        | default('', true)
      }}
