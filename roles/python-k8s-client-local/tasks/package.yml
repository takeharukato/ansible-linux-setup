#  Python 言語版 Kubernetes client パッケージ導入処理
#
---

# Python 言語版 Kubernetes client のローカルパッケージをビルドして導入する
- name: Build and install local python k8s client packages
  when:
    - not (ansible_check_mode | bool)
  block:

    # python_k8s_client_version_specが空でないことを確認する
    - name: Assert python_k8s_client_version_spec is not empty
      ansible.builtin.assert:
        that:
          - python_k8s_client_version_spec | default('', true) | string | trim | length > 0
        fail_msg: >-
          python_k8s_client_version_spec is empty.
          Please specify a version spec for the Kubernetes python client.

    # Python k8s client 構築用の作業ディレクトリパスを実行ユーザごとに初期化する
    - name: Set effective workspace for python k8s client build
      ansible.builtin.set_fact:
        python_k8s_client_build_workspace_effective: >-
          /tmp/python-k8s-client-build-{{ lookup('env', 'USER') | default('ansible', true) }}
      run_once: true

    # 制御ホスト上に作業ディレクトリを作成し, 書き込み不可の場合は代替へ切り替える
    - name: Ensure python k8s client build workspace exists on controller for pkgbld-common
      run_once: true
      block:

        # 制御ホスト上に作業ディレクトリを作成する
        - name: Create configured python k8s client build workspace on controller
          ansible.builtin.file:
            path: "{{ python_k8s_client_build_workspace_effective }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false

        # 作業ディレクトリに書き込み権が設定されていることを確認する
        - name: Verify configured python k8s client build workspace is writable on controller
          ansible.builtin.command:
            argv:
              - /bin/sh
              - -c
              - >-
                probe="{{ python_k8s_client_build_workspace_effective }}/.ansible-write-probe-$$";
                touch "$probe" && rm -f "$probe"
          delegate_to: localhost
          become: false
          changed_when: false

      rescue:

        # 制御ホスト上の作業ディレクトリが書き込み不可の場合は代替パスへ切り替える
        - name: Switch python k8s client build workspace to per-user fallback path
          ansible.builtin.set_fact:
            python_k8s_client_build_workspace_effective: >-
              /tmp/python-k8s-client-build-fallback-{{ lookup('env', 'USER') | default('ansible', true) }}

        # 制御ホスト上の作業ディレクトリを代替パスに作成する
        - name: Create fallback python k8s client build workspace on controller
          ansible.builtin.file:
            path: "{{ python_k8s_client_build_workspace_effective }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false

        # 制御ホスト上の代替作業ディレクトリが書き込み可能であることを確認する
        - name: Verify fallback python k8s client build workspace is writable on controller
          ansible.builtin.command:
            argv:
              - /bin/sh
              - -c
              - >-
                probe="{{ python_k8s_client_build_workspace_effective }}/.ansible-write-probe-$$";
                touch "$probe" && rm -f "$probe"
          delegate_to: localhost
          become: false
          changed_when: false

    #
    # pkgbld-common に渡すビルド関連ファイルを制御ホスト上に生成する
    #

    # Debian 系パッケージ用 build スクリプトを制御ホスト上に生成する
    - name: Render python k8s client deb build script on controller for pkgbld-common
      ansible.builtin.template:
        src: build-python-k8s-client-deb.sh.j2
        dest: "{{ python_k8s_client_build_workspace_effective }}/build-python-k8s-client-deb.sh"
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    # Debian 系パッケージ用 control テンプレートを制御ホスト上に生成する
    - name: Render python k8s client deb control template on controller for pkgbld-common
      ansible.builtin.template:
        src: python-k8s-client.control.j2
        dest: "{{ python_k8s_client_build_workspace_effective }}/python-k8s-client.control"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    # RHEL 系パッケージ用 build スクリプトを制御ホスト上に生成する
    - name: Render python k8s client rpm build script on controller for pkgbld-common
      ansible.builtin.template:
        src: build-python-k8s-client-rpm.sh.j2
        dest: "{{ python_k8s_client_build_workspace_effective }}/build-python-k8s-client-rpm.sh"
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    # RHEL 系パッケージ用 spec テンプレートを制御ホスト上に生成する
    - name: Render python k8s client rpm spec template on controller for pkgbld-common
      ansible.builtin.template:
        src: python-k8s-client.spec.j2
        dest: "{{ python_k8s_client_build_workspace_effective }}/python-k8s-client.spec"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    # Python k8s client builder Dockerfileを生成する (Debian/Ubuntu用)
    - name: Render python k8s client deb builder Dockerfile on controller for pkgbld-common
      ansible.builtin.template:
        src: Dockerfile.ubuntu.j2
        dest: "{{ python_k8s_client_build_workspace_effective }}/Dockerfile.python-k8s-client-deb"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    # Python k8s client builder Dockerfileを生成する (RHEL系用)
    - name: Render python k8s client rpm builder Dockerfile on controller for pkgbld-common
      ansible.builtin.template:
        src: Dockerfile.almalinux.j2
        dest: "{{ python_k8s_client_build_workspace_effective }}/Dockerfile.python-k8s-client-rpm"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    #
    # 期待バージョンの解決に先立って builder image を生成する
    #

    # Python k8s client の builder image を構築する
    - name: Prepare python k8s client builder image via pkgbld-common
      ansible.builtin.include_role:
        name: pkgbld-common
        tasks_from: prepare-builder-image.yml
      vars:
        package_build_host: "{{ python_k8s_client_build_host }}"
        package_build_workspace: "{{ python_k8s_client_build_workspace_effective }}"

        pkgbld_container_runtime: "{{ python_k8s_client_build_container_runtime }}"
        pkgbld_container_network_mode: "{{ python_k8s_client_build_container_network_mode }}"

        pkgbld_builder_image_debian: "{{ python_k8s_client_build_container_image_debian }}"
        pkgbld_builder_image_rhel: "{{ python_k8s_client_build_container_image_rhel }}"

        pkgbld_builder_dockerfile_src_debian: >-
          {{ python_k8s_client_build_workspace_effective }}/Dockerfile.python-k8s-client-deb
        pkgbld_builder_dockerfile_src_rhel: >-
          {{ python_k8s_client_build_workspace_effective }}/Dockerfile.python-k8s-client-rpm

    #
    # 指定された version spec から実際に導入されるバージョンを解決する
    #

    # 版数指定から実際に導入される kubernetes パッケージ版数を構築ホストで解決する
    - name: Query requested kubernetes python client version from spec on build host for pkgbld-common
      ansible.builtin.command:
        argv:
          - "{{ python_k8s_client_build_container_runtime }}"
          - run
          - --rm
          - --network
          - "{{ python_k8s_client_build_container_network_mode }}"
          - -e
          - "K8S_PY_CLIENT_VERSION_SPEC={{ python_k8s_client_version_spec }}"
          - -e
          - >-
            K8S_PY_CLIENT_PYTHON_VERSION={{
              k8s_python_packages_version
              | default('', true)
              | string
              | trim
            }}
          - >-
            {{
              (ansible_facts.os_family == 'Debian')
              | ternary(
                python_k8s_client_build_container_image_debian,
                python_k8s_client_build_container_image_rhel
              )
            }}
          - /bin/bash
          - -lc
          - |-
            set -euo pipefail

            if [[ -n "${K8S_PY_CLIENT_PYTHON_VERSION}" ]]; then
              pycmd="/usr/bin/python${K8S_PY_CLIENT_PYTHON_VERSION}"
            else
              pycmd="/usr/bin/python3"
            fi

            "${pycmd}" -m pip --version >/dev/null 2>&1 || \
              "${pycmd}" -m ensurepip --upgrade

            workdir="$(mktemp -d)"
            trap 'rm -rf "${workdir}"' EXIT

            "${pycmd}" -m venv --copies "${workdir}/venv"

            "${workdir}/venv/bin/pip" install \
              --upgrade pip >/dev/null

            "${workdir}/venv/bin/pip" install \
              "kubernetes${K8S_PY_CLIENT_VERSION_SPEC}" \
              packaging >/dev/null

            "${workdir}/venv/bin/python" -c \
              'import kubernetes; print(kubernetes.__version__)'
      register: python_k8s_client_expected_version_cmd
      changed_when: false
      delegate_to: "{{ python_k8s_client_build_host }}"
      run_once: true

    # 解決した kubernetes パッケージ版数を後続の検証用期待値として保存する
    - name: Set expected kubernetes python client version for pkgbld-common verification
      ansible.builtin.set_fact:
        python_k8s_client_installed_version_expected: >-
          {{ python_k8s_client_expected_version_cmd.stdout | trim }}

    #
    # インストール後検証用の Python interpreter を決定する
    #

    # 検証コマンドで利用する Python 実行ファイルを対象ホスト条件に応じて決定する
    - name: Select target python interpreter for verification (pkgbld-common)
      ansible.builtin.set_fact:
        python_k8s_client_target_python_cmd: >-
          {{
            (
              '/usr/bin/python' ~
              (k8s_python_packages_version | string | trim)
            )
            if (
              (k8s_python_packages_version is defined)
              and
              (
                (k8s_python_packages_version | string | trim | length)
                > 0
              )
            )
            else '/usr/bin/python3'
          }}

    #
    # pkgbld-common によるパッケージ構築・導入
    #

    # Python k8s client パッケージ構築処理を pkgbld-common に委譲し, 構築ホストで導入する
    - name: Build and install python k8s client local packages via pkgbld-common # noqa var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: pkgbld-common
      vars:
        package_build_host: "{{ python_k8s_client_build_host }}"
        package_build_workspace: "{{ python_k8s_client_build_workspace_effective }}"
        package_build_output_dir: "{{ python_k8s_client_build_workspace_effective }}/output"

        pkgbld_container_runtime: "{{ python_k8s_client_build_container_runtime }}"
        pkgbld_container_network_mode: "{{ python_k8s_client_build_container_network_mode }}"

        # builder image は上記の prepare-builder-image.yml で構築済みなので,
        # pkgbld-common 本体では再構築しない
        pkgbld_builder_image_prepared: true

        pkgbld_builder_image_debian: "{{ python_k8s_client_build_container_image_debian }}"
        pkgbld_builder_image_rhel: "{{ python_k8s_client_build_container_image_rhel }}"

        pkgbld_builder_dockerfile_src_debian: >-
          {{ python_k8s_client_build_workspace_effective }}/Dockerfile.python-k8s-client-deb
        pkgbld_builder_dockerfile_src_rhel: >-
          {{ python_k8s_client_build_workspace_effective }}/Dockerfile.python-k8s-client-rpm

        pkgbld_container_workdir: "{{ python_k8s_client_build_container_workdir }}"
        pkgbld_container_output_dir: "{{ python_k8s_client_build_container_workdir }}/output"

        pkgbld_build_script_src_debian: >-
          {{ python_k8s_client_build_workspace_effective }}/build-python-k8s-client-deb.sh
        pkgbld_build_script_name_debian: "build-python-k8s-client-deb.sh"

        pkgbld_build_script_src_rhel: >-
          {{ python_k8s_client_build_workspace_effective }}/build-python-k8s-client-rpm.sh
        pkgbld_build_script_name_rhel: "build-python-k8s-client-rpm.sh"

        # pkgbld-common の後方互換用
        pkgbld_build_script_src: >-
          {{ python_k8s_client_build_workspace_effective }}/build-python-k8s-client-deb.sh
        pkgbld_build_script_name: "build-python-k8s-client-deb.sh"

        pkgbld_package_type: "deb"
        pkgbld_package_name: "{{ python_k8s_client_deb_package_name }}"

        pkgbld_package_file_patterns_debian:
          - "{{ python_k8s_client_deb_package_name }}_*.deb"

        pkgbld_package_file_patterns_rhel:
          - "{{ python_k8s_client_rpm_package_name }}-*.rpm"

        package_targets: "{{ ansible_play_hosts_all }}"

        pkgbld_install_deb_lock_wait_seconds: >-
          {{ python_k8s_client_install_deb_lock_wait_seconds }}

        pkgbld_build_timeout_seconds: >-
          {{ python_k8s_client_build_timeout_seconds }}

        pkgbld_build_loop_delay_seconds: >-
          {{ python_k8s_client_build_loop_delay_seconds }}

        pkgbld_container_env_args:
          - "-e"
          - "K8S_PY_CLIENT_VERSION_SPEC={{ python_k8s_client_version_spec }}"
          - "-e"
          - >-
            K8S_PY_CLIENT_DEB_PACKAGE_NAME={{
              python_k8s_client_deb_package_name
            }}
          - "-e"
          - >-
            K8S_PY_CLIENT_RPM_PACKAGE_NAME={{
              python_k8s_client_rpm_package_name
            }}
          - "-e"
          - >-
            K8S_PY_CLIENT_PYTHON_VERSION={{
              k8s_python_packages_version
              | default('', true)
              | string
              | trim
            }}

        pkgbld_verify_version_enabled: true

        pkgbld_verify_version_command:
          - "{{ python_k8s_client_target_python_cmd }}"
          - -c
          - >-
            import kubernetes; print(kubernetes.__version__)

        pkgbld_verify_version_regex: >-
          ([0-9]+\.[0-9]+\.[0-9]+(?:[a-z]+[0-9]+)?)

        pkgbld_verify_version_expected: >-
          {{ python_k8s_client_installed_version_expected }}
