#  group_vars/all/all.yml やhost_varsで上書き可能とするため,
#  ロール名/defaults/main.yml に定義している

---

# リブート時のタイムアウト秒数
reboot_common_timeout: "{{ reboot_timeout_sec | default(600, true) }}"

# リブートメッセージ
reboot_common_message: "Reboot triggered by role: common"

# リブート開始前の遅延秒数
reboot_common_pre_reboot_delay: 2

# リブート実行時に権限昇格を実施することを指定する
reboot_common_become: true

# 再起動後に wait_for_connection を追加実行するかどうか
reboot_common_wait_for_connection_enabled: true

# wait_for_connection 全体の待機タイムアウト秒数
reboot_common_wait_for_connection_timeout: 1800

# wait_for_connection の1回あたり接続タイムアウト秒数
reboot_common_wait_for_connection_connect_timeout: 15

# wait_for_connection 開始前の遅延秒数
reboot_common_wait_for_connection_delay_seconds: 10

# wait_for_connection のポーリング間隔秒数
reboot_common_wait_for_connection_sleep_seconds: 10

# wait_for_connection 全体を再試行する最大試行回数
reboot_common_wait_for_connection_retries: 10

# wait_for_connection 再試行の間隔秒数
reboot_common_wait_for_connection_retry_delay_seconds: 30

# 通常時の SSH 多重化設定は維持し, 再起動フェーズのみ ControlMaster を無効化するかどうか
reboot_common_disable_controlmaster_during_reboot: true

# 再起動フェーズのみ追加する SSH 引数
reboot_common_reboot_phase_ssh_common_args: "-o ControlMaster=no -o ControlPersist=no"
